<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carmen 113">
<meta name="description" content="Sigue la gira Mañanas de Euforia de Carmen 113 en directo">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Carmen 113 · Mañanas de Euforia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#cc00cc;--pink-dim:#990099;--pink-bg:rgba(204,0,204,0.07);
  --black:#ffffff;--white:#111111;
  --g1:#f5f5f5;--g2:#ebebeb;--g3:#d8d8d8;--g4:#aaaaaa;--g5:#666666;--g6:#333333;
  --font:'Geologica',sans-serif;--r:10px;--rl:16px;--rs:4px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--black);color:var(--white);min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font)}

/* SOCIAL BADGE */
.social-badge{position:fixed;bottom:0;left:0;right:0;z-index:99;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding:10px 0 max(10px, env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.social-badge-wrap{position:fixed;bottom:0;left:0;right:0;z-index:99;display:flex;justify-content:center}
.social-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;color:var(--g5);text-decoration:none;transition:color .15s;font-size:9px;font-weight:500;letter-spacing:.3px;background:none;border:none;cursor:pointer;font-family:var(--font)}
.social-btn:hover{color:#FF66FF}
.social-btn svg{width:22px;height:22px}
.social-btn.share-btn{color:var(--g5)}

/* PAGES */
.page{display:none;max-width:680px;margin:0 auto;padding:0 16px 80px}
.page.active{display:block}

/* HEADER */
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;background:#0a0a0a;margin-bottom:16px}
.logo-img{height:17px}
.header-concert{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;overflow:hidden}
.header-concert-sala{font-size:13px;font-weight:600;color:#FF66FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;display:block}
.header-concert-city{font-size:10px;color:rgba(255,102,255,.65);display:block}
.band-badge{font-size:9px;color:#FF66FF;background:rgba(255,102,255,0.1);border:1px solid rgba(255,102,255,.3);padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.back-btn{font-size:22px;color:#FF66FF;line-height:1;flex-shrink:0;padding:4px 0}
.back-btn:hover{opacity:.7}
.logo-right{flex-shrink:0}

/* CONCERTS */
.concerts-list{display:flex;flex-direction:column;gap:2px}
.concert-card{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 14px;background:var(--g1);border-radius:var(--r);text-align:left;transition:background .15s;width:100%;border:1px solid var(--g2);cursor:pointer}
.concert-card:hover{background:var(--g2)}
.date-box{display:flex;flex-direction:column;align-items:center;gap:1px}
.date-dow{font-size:9px;font-weight:500;color:var(--g5);letter-spacing:.5px}
.date-num{font-size:22px;font-weight:300;line-height:1;color:var(--white)}
.date-mon{font-size:9px;font-weight:500;color:var(--g5);letter-spacing:.5px}
.concert-info{display:flex;flex-direction:column;gap:3px}
.concert-sala{font-size:14px;font-weight:500;color:var(--white)}
.concert-city{font-size:12px;color:var(--g5)}
.concert-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.concert-hora{font-size:11px;color:var(--g5)}
.btn-entrades{font-size:10px;color:#fff;background:var(--pink);padding:4px 10px;border-radius:20px;font-weight:600}
.posts-count{font-size:10px;color:var(--pink)}

/* CONCERT PAGE */
.concert-header{padding:16px 0 24px}
.concert-header-date{font-size:11px;color:var(--g5);margin-bottom:6px;text-transform:capitalize}
.concert-header-sala{font-size:24px;font-weight:700;line-height:1.1;margin-bottom:4px;color:var(--white)}
.concert-header-city{font-size:14px;color:var(--g5)}
.timeline{display:flex;flex-direction:column;gap:10px}

/* POST CARD */
.post-card{background:var(--g1);border-radius:var(--rl);overflow:hidden;border:1px solid var(--g2)}
.post-card.is-final{border-color:var(--pink);border-width:2px}
.final-badge{background:var(--pink-bg);color:var(--pink);font-size:10px;font-weight:700;letter-spacing:.5px;padding:6px 16px;text-align:center;border-bottom:1px solid rgba(204,0,204,.15)}
.post-meta{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.post-autor{font-size:12px;font-weight:700;letter-spacing:.3px}
.post-hora{font-size:11px;color:var(--g5);flex:1}
.post-band-actions{display:flex;gap:4px}
.btn-band-action{font-size:11px;color:var(--g4);padding:3px 7px;border-radius:3px;border:1px solid var(--g3);transition:all .1s;background:var(--black)}
.btn-band-action:hover{border-color:var(--pink);color:var(--pink)}
.btn-delete:hover{border-color:#ff4444;color:#ff4444!important}
.post-text{font-size:16px;line-height:1.7;padding:4px 14px 14px;color:var(--white)}

/* POLAROID */
.polaroid-wrap{padding:10px 14px 0}
.polaroid{background:#fff;padding:10px 10px 32px;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:2px;display:inline-block;width:100%}
.polaroid img{width:100%;height:auto;max-height:500px;object-fit:contain;display:block;background:#f0f0f0}
.polaroid-caption{font-size:12px;color:#555;margin-top:8px;text-align:center;font-style:italic;min-height:16px}
.post-polaroid-wrap{padding:10px 14px 6px}

/* LIKES */
.post-footer{display:flex;align-items:center;gap:12px;padding:10px 14px 12px;border-top:1px solid var(--g2)}
.btn-like{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--g5);transition:all .15s;padding:4px 8px;border-radius:20px}
.btn-like:hover{background:var(--pink-bg);color:var(--pink)}
.btn-like.liked{color:var(--pink);font-weight:600}
.like-count{font-size:12px}
.btn-comentar{font-size:12px;color:var(--g5);padding:4px 8px;border-radius:20px;transition:all .15s}
.btn-fan-like{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:4px;padding:5px 0;background:transparent;color:var(--g5);border:1px solid var(--border);border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-fan-like:hover{background:var(--pink-bg);color:var(--pink);border-color:rgba(204,0,204,0.2)}
.btn-fan-like.liked{color:var(--pink);font-weight:600;border-color:rgba(204,0,204,0.3);background:var(--pink-bg)}
.btn-cm-like{background:none;border:none;cursor:pointer;font-size:11px;color:var(--g5);padding:2px 4px;border-radius:12px;transition:all .15s;display:inline-flex;align-items:center;gap:3px;line-height:1}
.btn-cm-like:hover{color:var(--pink)}
.btn-cm-like.liked{color:var(--pink);font-weight:600}
.story-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:center;justify-content:center}
.story-modal{background:#111;border:1px solid #333;border-radius:16px;padding:24px 20px;width:calc(100% - 40px);max-width:400px;display:flex;flex-direction:column;gap:14px}
.story-modal h3{color:#fff;font-size:15px;font-weight:700;text-align:center;margin:0;letter-spacing:.5px}
.story-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.story-type-btn{background:#1a1a1a;border:2px solid #333;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:#e0e0e0;font-size:11px;font-weight:600;letter-spacing:.3px;transition:all .15s;font-family:var(--font)}
.story-type-btn:hover{border-color:var(--pink);color:var(--pink)}
.story-type-btn .icon{font-size:28px}
.btn-story-cancel{background:none;border:1px solid #444;border-radius:8px;color:#888;padding:10px;font-size:13px;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-story-cancel:hover{border-color:#666;color:#ccc}
.btn-comentar:hover{background:var(--g2);color:var(--white)}

/* COMENTARIS */
.comentarios-wrap{border-top:1px solid var(--g2);padding:0 14px 12px}
.comentarios-list{display:flex;flex-direction:column;gap:5px;padding-top:10px}
.comentario-item{background:var(--g1);border:1px solid var(--g2);padding:8px 10px;border-radius:var(--rs);display:flex;flex-direction:row;align-items:flex-start;gap:8px}
.comentario-body{display:flex;flex-direction:column;gap:2px;flex:1}
.comentario-autor{font-size:10px;font-weight:700;color:var(--pink)}
.comentario-text{font-size:13px;color:var(--g6);line-height:1.5}
.btn-cm-delete{font-size:11px;color:var(--g4);padding:2px 5px;border-radius:3px;flex-shrink:0;transition:all .1s;margin-top:1px}
.btn-cm-delete:hover{color:#cc3333;background:rgba(200,0,0,0.08)}
.btn-share{font-size:11px;color:var(--g5);padding:3px 8px;border-radius:3px;border:1px solid var(--g3);background:var(--black);transition:all .1s;cursor:pointer}
.btn-share:hover{border-color:#E1306C;color:#E1306C}
.btn-collage{font-size:12px;color:#fff;background:var(--pink);padding:8px 16px;border-radius:20px;font-weight:600;transition:background .15s;width:100%;margin-top:8px}
.btn-collage:hover{background:var(--pink-dim)}
.modal-collage{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;flex-direction:column;padding:20px 16px;overflow-y:auto}
.modal-collage.open{display:flex}
.modal-collage-title{font-size:16px;font-weight:700;color:#FF66FF;margin-bottom:6px}
.modal-collage-sub{font-size:12px;color:var(--g5);margin-bottom:16px}
.collage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.collage-thumb{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;aspect-ratio:1}
.collage-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.collage-thumb.selected::after{content:"✓";position:absolute;inset:0;background:rgba(255,102,255,0.55);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:700}
.collage-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.comentario-form{margin-top:8px;display:flex;flex-direction:column;gap:6px}

/* INPUTS */
.inp{background:var(--black);border:1px solid var(--g3);color:var(--white);border-radius:var(--rs);padding:10px 12px;font-size:13px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--pink)}
.inp::placeholder{color:var(--g4)}
textarea.inp{resize:none;line-height:1.5}

/* BUTTONS */
.btn-pink{background:var(--pink);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:30px;transition:background .15s;width:100%}
.btn-pink:hover:not(:disabled){background:var(--pink-dim)}
.btn-pink:disabled{opacity:.5;cursor:not-allowed}
.btn-gray{background:var(--g2);color:var(--white);font-size:12px;font-weight:500;padding:8px 16px;border-radius:20px;transition:background .15s;border:1px solid var(--g3)}
.btn-gray:hover:not(:disabled){background:var(--pink);color:#fff;border-color:var(--pink)}
.btn-gray:disabled{opacity:.5;cursor:not-allowed}
.btn-dashed{width:100%;padding:14px;border:1px dashed var(--g3);border-radius:var(--r);color:var(--g5);font-size:13px;transition:all .15s;text-align:center;background:var(--black)}
.btn-dashed:hover{border-color:var(--pink);color:var(--pink)}

/* NOU POST FORM */
.nou-post-form{background:var(--g1);border-radius:var(--rl);padding:18px;border:1px solid var(--g3);display:flex;flex-direction:column;gap:14px}
.form-header{display:flex;justify-content:space-between;align-items:center}
.form-title{font-size:13px;font-weight:700;color:var(--pink)}
.field-label{font-size:10px;font-weight:500;color:var(--g5);letter-spacing:.3px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--g3);color:var(--g5);transition:all .1s;cursor:pointer;background:var(--black)}
.chip:hover{border-color:var(--g4);color:var(--white)}
.chip.active{border-color:var(--pink)!important;color:var(--pink)!important;background:var(--pink-bg)}
.tipus-btns{display:flex;gap:5px}
.tipus-btn{flex:1;padding:10px 6px;border-radius:var(--rs);border:1px solid var(--g3);color:var(--g5);font-size:12px;transition:all .1s;cursor:pointer;text-align:center;background:var(--black)}
.tipus-btn:hover{border-color:var(--g4);color:var(--white)}
.tipus-btn.active{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.file-label{display:block;padding:12px;text-align:center;border:1px dashed var(--g3);border-radius:var(--rs);color:var(--g5);font-size:13px;cursor:pointer;transition:all .15s;background:var(--black)}
.file-label:hover{border-color:var(--pink);color:var(--pink)}
.file-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.progress-bar{height:3px;background:var(--g2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--pink);transition:width .2s}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--g5);cursor:pointer}
input[type=checkbox]{accent-color:var(--pink);width:13px;height:13px}
input[type=file]{display:none}

/* FANS SECTION */
.fans-section{margin-top:40px;padding-top:28px;border-top:2px solid var(--pink-bg)}
.fans-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.fans-title{font-size:15px;font-weight:500;color:var(--pink)}
.fans-count{font-size:11px;background:var(--pink-bg);color:var(--pink);border:1px solid rgba(204,0,204,.2);padding:2px 8px;border-radius:20px}
.fans-upload{background:var(--g1);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:7px;margin-bottom:20px;border:1px solid var(--g2)}
.fans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.fan-polaroid{background:#fff;padding:8px 8px 28px;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:2px}
.fan-img{width:100%;height:auto;max-height:300px;object-fit:contain;display:block;background:#f0f0f0}
.fan-autor{font-size:10px;color:#888;margin-top:6px;text-align:center}
.fan-polaroid{position:relative}
.btn-fan-delete{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s}
.btn-fan-delete:hover{background:rgba(200,0,0,0.8)}
.btn-fan-story{position:absolute;bottom:32px;right:4px;background:rgba(0,0,0,0.55);color:#FF66FF;border:none;border-radius:12px;padding:3px 7px;font-size:10px;font-weight:700;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-fan-story:hover{background:rgba(255,102,255,0.7);color:#fff}
.btn-fan-compartir{display:block;width:100%;margin-top:6px;padding:7px 0;background:var(--pink-bg);color:var(--pink);border:1px solid rgba(204,0,204,0.2);border-radius:var(--rs);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-align:center}
.btn-fan-compartir:hover{background:var(--pink);color:#fff}
.fan-comentario{font-size:11px;color:#666;text-align:center;font-style:italic;margin-top:2px}

/* EMPTY / LOADING */
.empty{padding:40px 0;text-align:center;color:var(--g5);font-size:13px;line-height:1.7}
.skeleton{height:80px;background:var(--g2);border-radius:var(--r);animation:shimmer 1.5s infinite;margin-bottom:2px}
.loading-dot{width:8px;height:8px;background:var(--pink);border-radius:50%;animation:shimmer 1s infinite;margin:80px auto}
.err{font-size:11px;color:#cc3333}

/* MODAL FOTO */
.modal-foto{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out}
.modal-foto.open{display:flex}
.modal-foto img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px}
.modal-close{position:fixed;top:16px;right:18px;color:#fff;font-size:28px;font-weight:300;cursor:pointer;line-height:1;z-index:1001;opacity:.8;transition:opacity .15s}
.modal-close:hover{opacity:1}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

@media(max-width:480px){
  .concert-card{grid-template-columns:44px 1fr auto;gap:10px;padding:12px 10px}
  .date-num{font-size:19px}
  .fans-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>

<!-- AGENDA -->

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://pztkayewglgthexnchov.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6dGtheWV3Z2xndGhleG5jaG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzkzODYsImV4cCI6MjEwNDM1NTM4Nn0.AqvN1j3BBuWsWOWVtC8XltLY9mehQXAsbwQ5X_JdL-4'
const BAND_TOKEN   = 'carmen113-mananas-de-euforia-2026'
const CLD_CLOUD    = 'yavl5m0q'
const CLD_PRESET   = 'carmen113_unsigned'
const MEMBRES      = ['Jaume','Jordi','Albert','Alfred','Roger','Rafa','Antonio','Sandra']
const COLORS       = {Jaume:'#cc00cc',Jordi:'#00aa88',Albert:'#cc8800',Alfred:'#0066cc',Roger:'#cc4400',Rafa:'#448800',Antonio:'#cc0044',Sandra:'#6600cc'}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
const urlParams = new URLSearchParams(location.search)
const isBand = urlParams.get('band') === BAND_TOKEN || localStorage.getItem('bandToken') === BAND_TOKEN
if(isBand) localStorage.setItem('bandToken', BAND_TOKEN)

// ID de sessió per als likes (persistent per dispositiu)
let sessionId = localStorage.getItem('c113_session')
if(!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('c113_session', sessionId) }

let currentConcertId = null

// ─── REALTIME ─────────────────────────────────────────────────────────────────
let rtChannel = null
let rtChannel2 = null

function startPolling(concertId) {
  stopPolling()
  startRealtime(concertId)
}

function stopPolling() {
  if(rtChannel) { rtChannel.unsubscribe(); rtChannel = null }
  if(rtChannel2) { rtChannel2.unsubscribe(); rtChannel2 = null }
}

function startRealtime(concertId) {
  // Canal 1: posts i comentarios
  rtChannel = db.channel('posts-' + concertId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'posts',
      filter: 'concert_id=eq.' + concertId
    }, (payload) => {
      const existing = document.getElementById('post-' + payload.new.id)
      if(!existing) afegirPostDOM(payload.new, concertId)
    })
    .on('postgres_changes', {
      event: 'DELETE',
      schema: 'public',
      table: 'posts'
    }, (payload) => {
      const el = document.getElementById('post-' + payload.old?.id)
      if(el) el.remove()
    })
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'comentaris'
    }, (payload) => {
      const c = payload.new
      const list = document.getElementById('cm-list-' + c.post_id)
      if(!list) return
      const div = document.createElement('div')
      if(document.getElementById('cm-item-' + c.id)) return
      div.className = 'comentario-item'
      div.id = 'cm-item-' + c.id
      const btnDel = isBand ? '<button class="btn-cm-delete" onclick="eliminarComentario(\'' + c.id + '\',this)" title="Eliminar">✕</button>' : ''
      div.innerHTML = '<div class="comentario-body"><span class="comentario-autor">' + esc(c.autor_nom) + '</span><span class="comentario-text">' + esc(c.text) + '</span></div>' + btnDel
      list.appendChild(div)
    })
    .subscribe((status) => console.log('RT1 status:', status))

  // Canal 2: likes i aportacions fans
  rtChannel2 = db.channel('likes-' + concertId)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'likes'
    }, (payload) => {
      const l = payload.new
      const countEl = document.querySelector('#post-' + l.post_id + ' .like-count')
      if(countEl) countEl.textContent = parseInt(countEl.textContent||0) + 1
    })
    .on('postgres_changes', {
      event: 'DELETE',
      schema: 'public',
      table: 'likes'
    }, (payload) => {
      const l = payload.old
      const countEl = document.querySelector('#post-' + l.post_id + ' .like-count')
      if(countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent||0) - 1)
    })
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'aportacions_fans',
      filter: 'concert_id=eq.' + concertId
    }, (payload) => {
      renderFansSection(concertId)
    })
    .subscribe((status) => console.log('RT2 status:', status))
}

function afegirPostDOM(post, concertId) {
  const tl = document.getElementById('timeline')
  if(!tl) return
  const empty = tl.querySelector('.empty')
  if(empty) empty.remove()
  const tmp = document.createElement('template')
  tmp.innerHTML = renderPost(post, [], 0, false)
  tl.appendChild(tmp.content.firstElementChild)
  if(post.es_final_concert) renderFansSection(concertId)
}

// ─── AGENDA ───────────────────────────────────────────────────────────────────
async function loadAgenda() {
  if(isBand) document.getElementById('band-badge').style.display = 'inline'
  const { data: concerts } = await db.from('concerts').select('*').order('data', {ascending:true})
  const { data: pcs } = await db.from('posts').select('concert_id')
  const countMap = {}
  pcs?.forEach(p => { countMap[p.concert_id] = (countMap[p.concert_id]||0)+1 })
  const list = document.getElementById('concerts-list')
  list.innerHTML = ''
  concerts?.forEach(c => {
    const d = new Date(c.data + 'T00:00:00')
    const dow = d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','').toUpperCase()
    const num = d.getDate()
    const mon = d.toLocaleDateString('es-ES',{month:'short'}).replace('.','').toUpperCase()
    const count = countMap[c.id]||0
    list.innerHTML += `<button class="concert-card" onclick="openConcert('${c.id}')">
      <div class="date-box"><span class="date-dow">${dow}</span><span class="date-num">${num}</span><span class="date-mon">${mon}</span></div>
      <div class="concert-info"><span class="concert-sala">${c.sala}</span><span class="concert-city">${c.ciutat}</span></div>
      <div class="concert-right">
        <span class="concert-hora">${c.hora.slice(0,5)}</span>
        ${c.entrades_url ? `<a href="${c.entrades_url}" target="_blank" class="btn-entrades" onclick="event.stopPropagation()">Entradas</a>` : ''}
        ${count > 0 ? `<span class="posts-count">${count} post${count!==1?'s':''}</span>` : ''}
      </div>
    </button>`
  })
}

// ─── CONCERT ──────────────────────────────────────────────────────────────────
async function openConcert(id) {
  currentConcertId = id
  stopPolling()
  document.getElementById('page-agenda').classList.remove('active')
  document.getElementById('page-concert').classList.add('active')
  document.getElementById('timeline').innerHTML = '<div class="loading-dot"></div>'
  document.getElementById('fans-section').innerHTML = ''
  document.getElementById('nou-post-container').style.display = 'none'
  if(isBand) document.getElementById('concert-band-badge').style.display = 'inline'

  const { data: c } = await db.from('concerts').select('*').eq('id', id).single()
  const d = new Date(c.data + 'T00:00:00')
  document.getElementById('header-sala').textContent = c.sala
  document.getElementById('header-city').textContent = c.ciutat
  document.getElementById('concert-data').textContent = d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
  document.getElementById('concert-sala').textContent = c.sala
  document.getElementById('concert-city').textContent = c.ciutat

  await renderTimeline(id)
  if(isBand) { document.getElementById('nou-post-container').style.display='block'; renderNouPostForm() }
  startPolling(id)
}

async function renderTimeline(concertId) {
  const { data: posts } = await db.from('posts').select('*').eq('concert_id', concertId).order('created_at', {ascending:true})
  const postIds = posts?.map(p=>p.id) || []
  
  const [{ data: comentarios }, { data: likesData }] = await Promise.all([
    postIds.length ? db.from('comentaris').select('*').in('post_id', postIds).order('created_at', {ascending:true}) : {data:[]},
    postIds.length ? db.from('likes').select('post_id, session_id').in('post_id', postIds) : {data:[]}
  ])

  const cmIds = comentarios?.map(c => c.id) || []
  const { data: cmLikesData } = cmIds.length
    ? await db.from('likes_comentaris').select('comentari_id, session_id').in('comentari_id', cmIds)
    : { data: [] }

  const cmMap = {}, likesMap = {}, myLikesMap = {}
  const cmLikesMap = {}, myCmLikesMap = {}
  comentarios?.forEach(c => { if(!cmMap[c.post_id]) cmMap[c.post_id]=[]; cmMap[c.post_id].push(c) })
  likesData?.forEach(l => {
    likesMap[l.post_id] = (likesMap[l.post_id]||0) + 1
    if(l.session_id === sessionId) myLikesMap[l.post_id] = true
  })
  cmLikesData?.forEach(l => {
    cmLikesMap[l.comentari_id] = (cmLikesMap[l.comentari_id]||0) + 1
    if(l.session_id === sessionId) myCmLikesMap[l.comentari_id] = true
  })

  const tl = document.getElementById('timeline')
  if(!posts?.length) { tl.innerHTML = '<div class="empty">Pronto el grupo publicará la primera entrada desde la carretera.</div>'; return }
  tl.innerHTML = posts.map(p => renderPost(p, cmMap[p.id]||[], likesMap[p.id]||0, !!myLikesMap[p.id], cmLikesMap, myCmLikesMap)).join('')

  const hiHaFinal = posts.some(p => p.es_final_concert)
  if(hiHaFinal) renderFansSection(concertId)
}

function renderPost(p, comentarios, likes, myLike, cmLikesMap={}, myCmLikesMap={}) {
  const color = COLORS[p.autor] || '#888'
  const hora = new Date(p.created_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})
  const finalBadge = p.es_final_concert ? '<div class="final-badge">✦ Final de concierto</div>' : ''
  const shareBtn = (isBand && p.tipus === 'foto' && p.cloudinary_url)
    ? `<button class="btn-share" onclick="generarPolaroidInstagram('${p.id}','${p.cloudinary_url}','${esc(p.contingut||'')}')" >📲 Story</button>`
    : ''
  const bandActs = isBand ? `<div class="post-band-actions">
    ${shareBtn}
    <button class="btn-band-action" onclick="toggleFinal('${p.id}',${!p.es_final_concert})" title="${p.es_final_concert?'Desmarcar':'Final concierto'}">${p.es_final_concert?'✦':'○'}</button>
    <button class="btn-band-action btn-delete" onclick="deletePost('${p.id}')" title="Eliminar">✕</button>
  </div>` : ''

  let contingut = ''
  if(p.tipus === 'text') {
    contingut = `<p class="post-text">${esc(p.contingut||'')}</p>`
  } else if(p.tipus === 'foto' && p.cloudinary_url) {
    const url = p.cloudinary_url.replace('/upload/','/upload/w_1200,q_80,f_webp/')
    contingut = `<div class="post-polaroid-wrap"><div class="polaroid"><img src="${url}" alt="Foto de ${p.autor}" loading="lazy" onclick="obrirModal('${url}')" style="cursor:zoom-in"><p class="polaroid-caption">${esc(p.contingut||'')}</p></div></div>`
  }

  const cmHtml = comentarios.map(c => {
    const btnDel = isBand ? `<button class="btn-cm-delete" onclick="eliminarComentario('${c.id}',this)" title="Eliminar">✕</button>` : ''
    const myLikeCm = !!myCmLikesMap[c.id]
    const likesCm = cmLikesMap[c.id] || 0
    const btnLikeCm = `<button class="btn-cm-like${myLikeCm?' liked':''}" onclick="toggleLikeComentari('${c.id}',this)">${myLikeCm?'❤️':'🤍'} <span class="like-count">${likesCm||''}</span></button>`
    return `<div class="comentario-item" id="cm-item-${c.id}">
      <div class="comentario-body"><span class="comentario-autor">${esc(c.autor_nom)}</span><span class="comentario-text">${esc(c.text)}</span></div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px">${btnLikeCm}${btnDel}</div>
    </div>`
  }).join('')

  return `<article class="post-card${p.es_final_concert?' is-final':''}" id="post-${p.id}">
    ${finalBadge}
    <div class="post-meta">
      <span class="post-autor" style="color:${color}">${p.autor}</span>
      <span class="post-hora">${hora}</span>
      ${bandActs}
    </div>
    ${contingut}
    <div class="post-footer">
      <button class="btn-like${myLike?' liked':''}" onclick="toggleLike('${p.id}',this)">
        ${myLike ? '❤️' : '🤍'} <span class="like-count">${likes}</span>
      </button>
      <button class="btn-comentar" onclick="toggleComentaris('${p.id}')">
        💬 ${comentarios.length > 0 ? comentarios.length + ' comentario' + (comentarios.length!==1?'s':'') : 'Comenta'}
      </button>
    </div>
    <div id="cm-${p.id}" style="display:none" class="comentarios-wrap">
      <div class="comentarios-list" id="cm-list-${p.id}">${cmHtml}</div>
      <div class="comentario-form">
        <input class="inp" id="cm-nom-${p.id}" placeholder="Tu nombre" maxlength="50">
        <textarea class="inp" id="cm-text-${p.id}" placeholder="Escribe un comentario..." rows="2" maxlength="500"></textarea>
        <p id="cm-err-${p.id}" class="err" style="display:none"></p>
        <button class="btn-gray" onclick="enviarComentari('${p.id}')" style="align-self:flex-end">Enviar</button>
      </div>
    </div>
  </article>`
}

async function toggleLike(postId, btn) {
  const liked = btn.classList.contains('liked')
  if(liked) {
    await db.from('likes').delete().eq('post_id', postId).eq('session_id', sessionId)
    btn.classList.remove('liked')
    btn.innerHTML = '🤍 <span class="like-count">' + (parseInt(btn.querySelector('.like-count').textContent)-1) + '</span>'
  } else {
    await db.from('likes').insert({post_id: postId, session_id: sessionId})
    btn.classList.add('liked')
    btn.innerHTML = '❤️ <span class="like-count">' + (parseInt(btn.querySelector('.like-count').textContent)+1) + '</span>'
  }
}
// ─── LIKES FANS ───────────────────────────────────────────────────────────────
async function toggleLikeFan(fanId, btn) {
  const liked = btn.classList.contains('liked')
  const countEl = btn.querySelector('.like-count')
  const current = parseInt(countEl.textContent) || 0
  if(liked) {
    await db.from('likes_fans').delete().eq('fan_id', fanId).eq('session_id', sessionId)
    btn.classList.remove('liked')
    countEl.textContent = current - 1
    btn.querySelector('.like-emoji').textContent = '🤍'
  } else {
    await db.from('likes_fans').insert({fan_id: fanId, session_id: sessionId})
    btn.classList.add('liked')
    countEl.textContent = current + 1
    btn.querySelector('.like-emoji').textContent = '❤️'
  }
}

async function carregarLikesFans(fanIds) {
  if(!fanIds.length) return { likesMap: {}, myLikesMap: {} }
  const { data } = await db.from('likes_fans').select('fan_id, session_id').in('fan_id', fanIds)
  const likesMap = {}, myLikesMap = {}
  data?.forEach(l => {
    likesMap[l.fan_id] = (likesMap[l.fan_id] || 0) + 1
    if(l.session_id === sessionId) myLikesMap[l.fan_id] = true
  })
  return { likesMap, myLikesMap }
}

// ─── CLOUDINARY ───────────────────────────────────────────────────────────────
async function uploadCloudinary(file, progressFillId, progressBarId) {
  const pb = document.getElementById(progressBarId)
  const pf = document.getElementById(progressFillId)
  if(pb) pb.style.display = 'block'
  const formData = new FormData()
  formData.append('file', file)
  formData.append('upload_preset', CLD_PRESET)
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest()
    xhr.upload.onprogress = e => { if(e.lengthComputable && pf) pf.style.width = Math.round(e.loaded/e.total*100)+'%' }
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`)
    xhr.onload = () => {
      const d = JSON.parse(xhr.responseText)
      resolve(xhr.status===200 ? {url:d.secure_url, public_id:d.public_id} : null)
    }
    xhr.onerror = () => resolve(null)
    xhr.send(formData)
  })
}

        </button>

function tancarStorySelector() {
  const el = document.getElementById('story-selector-overlay')
  if(el) el.remove()
}

async function triarStoryBanda(tipus, cloudinaryUrl, caption) {
  tancarStorySelector()
  const sala = document.getElementById('header-sala')?.textContent || ''
  const data = document.getElementById('header-city')?.textContent || ''
  const imgUrl = cloudinaryUrl.replace('/upload/', '/upload/w_1200,q_90,f_jpg/')
  const img = new Image()
  img.crossOrigin = 'anonymous'
  img.onerror = () => {
    const img2 = new Image()
    img2.crossOrigin = 'anonymous'
    img2.onload = () => dibuixarStoryBandaTipus(tipus, img2, caption, sala, data)
    img2.onerror = () => alert('No s\'ha pogut carregar la imatge')
    img2.src = cloudinaryUrl + '?t=' + Date.now()
  }
  img.onload = () => dibuixarStoryBandaTipus(tipus, img, caption, sala, data)
  img.src = imgUrl + '?t=' + Date.now()
}

async function dibuixarStoryBandaTipus(tipus, img, caption, sala, data) {
  if(tipus === 'polaroid') return dibuixarPolaroid(img, caption, sala, data)
  if(tipus === 'cinta')    return dibuixarStoryCinta(img, caption, sala, data)
  if(tipus === 'segell')   return dibuixarStorySegell(img, caption, sala, data)
  if(tipus === 'single')   return dibuixarStorySingle(img, caption, sala, data)
}

async function dibuixarPolaroid(img, caption, sala, data) {
  const W = 1080
  const H = 1920
  const canvas = document.createElement('canvas')
  canvas.width = W
  canvas.height = H
  const ctx = canvas.getContext('2d')

  // Fons: portada del disc estirada i enfosquida
  await new Promise(resolve => {
    const bgImg = new Image()
    bgImg.onload = () => {
      // Escalar per cobrir tot el canvas mantenint proporcions
      const bgAR = bgImg.width / bgImg.height
      const canvasAR = W / H
      let bW, bH, bX, bY

  const destW = polW - INNER * 2
  const destH = destW // quadrat

  const srcAR = img.naturalWidth / img.naturalHeight
  let srcX = 0, srcY = 0, srcW = img.naturalWidth, srcH = img.naturalHeight
  if(srcAR > 1) {
    // Horitzontal: retallem els costats
    srcW = img.naturalHeight
    srcX = (img.naturalWidth - srcW) / 2
  } else if(srcAR < 1) {
    // Vertical: retallem dalt i baix
    srcH = img.naturalWidth
    srcY = (img.naturalHeight - srcH) / 2
  }
  ctx.drawImage(img, srcX, srcY, srcW, srcH, destX, destY, destW, destH)

  const tY = polY + INNER + destH

  const logoImg = new Image()
  logoImg.onload = () => {

    const logoH = Math.round(logoImg.height * logoW / logoImg.width)
    ctx.drawImage(logoImg, tX, tY + 30, logoW, logoH)

    ctx.fillStyle = '#222222'
    ctx.textAlign = 'left'
    ctx.fillText(sala || '', tX, tY + 30 + logoH + 50)

    ctx.fillStyle = '#888888'
    ctx.fillText(data || '', tX, tY + 30 + logoH + 95)

    // Peu de foto
    if(caption) {
      ctx.font = 'italic 30px Arial'
      ctx.fillStyle = '#666666'
      ctx.fillText(caption.length > 40 ? caption.slice(0,40) + '…' : caption, tX, tY + 30 + logoH + 145)
    }

    // Separador
    ctx.strokeStyle = '#FF66FF'
    ctx.lineWidth = 3
    ctx.beginPath()
    const sepY = caption ? tY + 30 + logoH + 170 : tY + 30 + logoH + 120
    ctx.moveTo(tX, sepY)
    ctx.lineTo(tX + polW - INNER * 2, sepY)
    ctx.stroke()

    // "Sigue la gira en directo ↓"
    ctx.font = '32px Arial'
    ctx.fillStyle = '#444444'
    ctx.fillText('Sigue la gira en directo ↓', tX, sepY + 48)

    // URL rosa
    ctx.font = 'bold 36px Arial'
    ctx.fillStyle = '#FF66FF'
    ctx.fillText('carmen113tour.vercel.app', tX, sepY + 100)

    // Descarregar
    const link = document.createElement('a')
    link.download = 'carmen113-story.jpg'
    link.href = canvas.toDataURL('image/jpeg', 0.92)
    link.click()

// ─── COLLAGE STORY ────────────────────────────────────────────────────────────
let collageSeleccio = []
let collageFotos = []

// ─── STORY: CINTA CINEMA ──────────────────────────────────────────────────────
async function dibuixarStoryCinta(img, caption, sala, data) {
  const W = 1080, H = 1920
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')

  ctx.fillStyle = '#0a0a0a'
  ctx.fillRect(0, 0, W, H)

  // ── Layout ──────────────────────────────────────────────────────────────
  const sideW = 72          // amplada bandes laterals perforacions
  const innerW = W - sideW * 2
  const gapH = 100          // franja negra de separació (hi ha 2: dalt i baix del central)

  // Fotograma central: ~50% de l'alçada disponible (descomptant les 2 franges)
  const frameMainH = Math.round((H - gapH * 2) * 0.52)
  // Fotogrames tallats: la resta dividida per 2
  const frameCropH = Math.round((H - frameMainH - gapH * 2) / 2)

  // Posicions Y de cada element
  const frame1Y = 0                                         // foto tallada superior
  const gap1Y   = frameCropH                                // franja negra superior
  const frame2Y = frameCropH + gapH                         // foto central (principal)
  const gap2Y   = frameCropH + gapH + frameMainH            // franja negra inferior (text+logo)
  const frame3Y = frameCropH + gapH * 2 + frameMainH        // foto tallada inferior

  // ── Escala comuna per als 3 fotogrames (mateixa foto, mateixa escala) ──
  const ar = img.naturalWidth / img.naturalHeight
  const targetAr = innerW / frameMainH
  let srcW = img.naturalWidth, srcH = img.naturalHeight
  if(ar > targetAr) { srcW = Math.round(srcH * targetAr) }
  else { srcH = Math.round(srcW / targetAr) }
  const srcX = (img.naturalWidth - srcW) / 2
  const srcY = (img.naturalHeight - srcH) / 2
  const scale = innerW / srcW
  const scaledH = Math.round(srcH * scale)  // alçada de la foto escalada al 100%

  // ── Fotograma superior: mostra la part INFERIOR de la foto ──────────────
  // La foto escalada comença desplaçada cap amunt perquè la part inferior quedi visible
  ctx.save()
  ctx.beginPath(); ctx.rect(sideW, frame1Y, innerW, frameCropH); ctx.clip()
  // Posicionem la foto de manera que la seva part inferior quedi al marc
  const topPhotoY = frame1Y + frameCropH - scaledH  // la base de la foto = base del fotograma
  ctx.drawImage(img, srcX, srcY, srcW, srcH, sideW, topPhotoY, innerW, scaledH)
  ctx.fillStyle = 'rgba(0,0,0,0.28)'
  ctx.fillRect(sideW, frame1Y, innerW, frameCropH)
  ctx.restore()

  // ── Fotograma central: foto completa ────────────────────────────────────
  ctx.drawImage(img, srcX, srcY, srcW, srcH, sideW, frame2Y, innerW, frameMainH)
  const grad = ctx.createLinearGradient(0, frame2Y + frameMainH * 0.58, 0, frame2Y + frameMainH)
  grad.addColorStop(0, 'rgba(0,0,0,0)')
  grad.addColorStop(1, 'rgba(0,0,0,0.78)')
  ctx.fillStyle = grad
  ctx.fillRect(sideW, frame2Y, innerW, frameMainH)
  ctx.textAlign = 'left'
  ctx.font = 'bold 38px Arial'; ctx.fillStyle = '#FF66FF'
  ctx.fillText('Carmen 113 · Live ✦', sideW + 20, frame2Y + frameMainH - 92)
  ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#fff'
  const captionText = caption && caption.length > 36 ? caption.slice(0,36)+'…' : (caption||'')
  if(captionText) ctx.fillText(captionText, sideW + 20, frame2Y + frameMainH - 52)

  // ── Fotograma inferior: mostra la part SUPERIOR de la foto ──────────────
  ctx.save()
  ctx.beginPath(); ctx.rect(sideW, frame3Y, innerW, frameCropH); ctx.clip()
  // La foto comença a l'inici del fotograma → es veu la part superior
  ctx.drawImage(img, srcX, srcY, srcW, srcH, sideW, frame3Y, innerW, scaledH)
  ctx.fillStyle = 'rgba(0,0,0,0.28)'
  ctx.fillRect(sideW, frame3Y, innerW, frameCropH)
  ctx.restore()

  // ── Franja negra 1 (entre superior i central): sala i data ──────────────
  ctx.textAlign = 'center'
  ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#FF66FF'
  const salaData = (sala + ' · ' + data)
  ctx.fillText(salaData.length > 38 ? salaData.slice(0,38)+'…' : salaData, W/2, gap1Y + gapH/2 + 12)

  // ── Franja negra 2 (entre central i inferior): URL + logo ───────────────
  ctx.font = 'bold 22px Arial'; ctx.fillStyle = '#666'
  ctx.fillText('carmen113tour.vercel.app', W/2, gap2Y + gapH - 14)

  // ── Perforacions als laterals ────────────────────────────────────────────
  const holeW = 32, holeH = 52, holeR = 8
  const numHoles = 14
  const holeGap = (H - 16) / numHoles
  ctx.fillStyle = '#2a2a2a'
  for(let i = 0; i < numHoles; i++) {
    const y = 8 + i * holeGap + (holeGap - holeH) / 2
    ctx.beginPath(); ctx.roundRect(10, y, holeW, holeH, holeR); ctx.fill()
    ctx.beginPath(); ctx.roundRect(W - 10 - holeW, y, holeW, holeH, holeR); ctx.fill()
  }

  // ── Logo a la franja inferior ────────────────────────────────────────────
  await new Promise(resolve => {
    const logoImg = new Image()
    logoImg.onload = () => {
      const lW = 140, lH = Math.round(logoImg.height * lW / logoImg.width)
      const off = document.createElement('canvas'); off.width = lW; off.height = lH
      const octx = off.getContext('2d')
      octx.drawImage(logoImg, 0, 0, lW, lH)
      octx.globalCompositeOperation = 'source-in'; octx.fillStyle = '#555'; octx.fillRect(0,0,lW,lH)
      ctx.drawImage(off, W - sideW - lW - 10, gap2Y + (gapH - lH) / 2 - 10)
      resolve()
    }

async function dibuixarStorySegell(img, caption, sala, data) {
  const W = 1080, H = 1920
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')

  // Fons crema
  ctx.fillStyle = '#f5f0e8'
  ctx.fillRect(0, 0, W, H)

  // Foto en blanc i negre
  const pad = 80
  const fW = W - pad*2, fH = fW
  const fY = (H - fH) / 2 - 60
  const ar = img.naturalWidth / img.naturalHeight
  let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight
  if(ar > 1) { sw = sh; sx = (img.naturalWidth - sw)/2 }
  else { sh = sw; sy = (img.naturalHeight - sh)/2 }
  const offBn = document.createElement('canvas'); offBn.width = fW; offBn.height = fH
  const bctx = offBn.getContext('2d')
  bctx.drawImage(img, sx, sy, sw, sh, 0, 0, fW, fH)
  const imgData = bctx.getImageData(0, 0, fW, fH); const d = imgData.data
  for(let i = 0; i < d.length; i += 4) { const g = d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114; d[i]=d[i+1]=d[i+2]=g }
  bctx.putImageData(imgData, 0, 0)
  ctx.drawImage(offBn, pad, fY, fW, fH)

  // Segell circular a la cantonada superior dreta, lleugerament torçat
  const R = 240
  const angle = 0.20  // ~11 graus de rotació
  // Posició: cantonada superior dreta de la foto, parcialment fora
  const scx = pad + fW - R * 0.6
  const scy = fY + R * 0.6

  ctx.save()
  ctx.translate(scx, scy)
  ctx.rotate(angle)
  ctx.globalAlpha = 0.93

  // Cercle exterior
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2)
  ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 18; ctx.stroke()
  // Farcit blanc semitransparent
  ctx.beginPath(); ctx.arc(0, 0, R - 9, 0, Math.PI*2)
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill()
  // Cercle interior
  ctx.beginPath(); ctx.arc(0, 0, R - 36, 0, Math.PI*2)
  ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 5; ctx.stroke()

  // Tot el text al centre (zona ampla del cercle), ben centrat verticalment
  ctx.fillStyle = '#cc0000'; ctx.textAlign = 'center'
  ctx.font = 'bold 34px Arial'
  const salaT = sala.length > 18 ? sala.slice(0,18)+'…' : sala
  ctx.fillText(salaT, 0, -48)
  ctx.font = 'bold 90px Arial'
  ctx.fillText('2026', 0, 46)
  ctx.font = 'bold 28px Arial'
  const dataT = data.toUpperCase().length > 20 ? data.toUpperCase().slice(0,20)+'…' : data.toUpperCase()
  ctx.fillText(dataT, 0, 88)

  ctx.restore()

  // Text baix
  ctx.textAlign = 'left'
  const tY = fY + fH + 48
  ctx.font = 'bold 38px Arial'; ctx.fillStyle = '#111'
  ctx.fillText('Carmen 113 · Live ✦', pad, tY)
  if(caption) {
    ctx.font = 'italic 28px Arial'; ctx.fillStyle = '#555'
    ctx.fillText(caption.length > 42 ? caption.slice(0,42)+'…' : caption, pad, tY + 50)
  }
  ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#cc0000'
  ctx.fillText('carmen113tour.vercel.app', pad, tY + (caption ? 98 : 58))

    const logoImg = new Image()
    logoImg.onload = () => {
      const lW = 200, lH = Math.round(logoImg.height * lW / logoImg.width)
      ctx.drawImage(logoImg, W - pad - lW, tY, lW, lH)
      resolve()

// ─── STORY: PORTADA DE SINGLE ─────────────────────────────────────────────────
async function dibuixarStorySingle(img, caption, sala, data) {
  const W = 1080, H = 1920
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')

  // Foto a tot el fons
  const ar = img.naturalWidth / img.naturalHeight
  let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight
  if(ar > W/H) { sw = Math.round(sh * W/H); sx = (img.naturalWidth - sw)/2 }
  else { sh = Math.round(sw * H/W); sy = (img.naturalHeight - sh)/2 }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H)

  // Gradient fosc
  const grad = ctx.createLinearGradient(0, 0, 0, H)
  grad.addColorStop(0, 'rgba(0,0,0,0.4)'); grad.addColorStop(0.5, 'rgba(0,0,0,0.05)')
  grad.addColorStop(0.65, 'rgba(0,0,0,0.1)'); grad.addColorStop(1, 'rgba(0,0,0,0.85)')
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H)

  // Caixa negra a baix
  const boxH = 360
  ctx.fillStyle = 'rgba(0,0,0,0.72)'
  ctx.fillRect(0, H - boxH, W, boxH)
  ctx.fillStyle = '#FF66FF'; ctx.fillRect(0, H - boxH, W, 5)

  // Text
  const bY = H - boxH + 48
  ctx.textAlign = 'left'
  ctx.font = 'bold 26px Arial'; ctx.fillStyle = '#FF66FF'
  ctx.fillText('Carmen 113 · Live', 48, bY)
  ctx.font = 'bold 44px Arial'; ctx.fillStyle = '#fff'
  ctx.fillText(sala.length > 24 ? sala.slice(0,24)+'…' : sala, 48, bY + 58)
  ctx.font = '30px Arial'; ctx.fillStyle = '#ccc'
  ctx.fillText(data, 48, bY + 100)
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(48, bY+122); ctx.lineTo(W-48, bY+122); ctx.stroke()
  if(caption) {
    ctx.font = 'italic 28px Arial'; ctx.fillStyle = '#ddd'
    ctx.fillText(caption.length > 44 ? caption.slice(0,44)+'…' : caption, 48, bY + 168)

  ctx.font = 'bold 22px Arial'; ctx.fillStyle = '#FF66FF'

async function obrirCollage(concertId) {
  collageSeleccio = []
  collageFotos = []

  // Recollim totes les fotos: posts banda + fans
  const { data: posts } = await db.from('posts')
    .select('cloudinary_url, contingut')
    .eq('concert_id', concertId)
    .eq('tipus', 'foto')
    .not('cloudinary_url', 'is', null)

  const { data: fans } = await db.from('aportacions_fans')
    .select('cloudinary_url, autor_nom, comentari')
    .eq('concert_id', concertId)
    .not('cloudinary_url', 'is', null)

  collageFotos = [
    ...(posts||[]).map(p => ({ url: p.cloudinary_url, label: p.contingut || 'Banda', comentari: null })),
    ...(fans||[]).map(f => ({ url: f.cloudinary_url, label: f.autor_nom, comentari: f.comentari || null }))
  ]

  if(collageFotos.length === 0) {
    alert('No hay fotos en este concierto todavía.')
    return
  }

  const grid = document.getElementById('collage-grid')
  grid.innerHTML = collageFotos.map((f, i) => {
    const thumb = f.url.replace('/upload/', '/upload/w_300,q_70,f_webp/')
    return `<div class="collage-thumb" id="cthumb-${i}" onclick="toggleCollageThumb(${i})">
      <img src="${thumb}" alt="${esc(f.label)}" loading="lazy">
    </div>`
  }).join('')

  document.getElementById('modal-collage').classList.add('open')
}

function toggleCollageThumb(idx) {
  const el = document.getElementById('cthumb-' + idx)
  const pos = collageSeleccio.indexOf(idx)
  if(pos === -1) {
    if(collageSeleccio.length >= 5) { alert('Máximo 5 fotos'); return }
    collageSeleccio.push(idx)
    el.classList.add('selected')
  } else {
    collageSeleccio.splice(pos, 1)
    el.classList.remove('selected')
  }
  const btn = document.getElementById('btn-gen-collage')
  btn.textContent = collageSeleccio.length >= 3
    ? `Generar Story (${collageSeleccio.length} fotos)`
    : `Selecciona ${3 - collageSeleccio.length} más`
  btn.disabled = collageSeleccio.length < 3
}

function tancarCollage() {
  document.getElementById('modal-collage').classList.remove('open')
}

async function generarCollage() {
  if(collageSeleccio.length < 3) return
  const btn = document.getElementById('btn-gen-collage')
  btn.textContent = 'Generando...'
  btn.disabled = true

  const sala = document.getElementById('header-sala')?.textContent || ''
  const ciutat = document.getElementById('header-city')?.textContent || ''

  // Carregar totes les imatges seleccionades
  const imgs = await Promise.all(collageSeleccio.map(idx => new Promise((resolve) => {
    const img = new Image()
    img.crossOrigin = 'anonymous'
    const url = collageFotos[idx].url.replace('/upload/', '/upload/w_800,q_85,f_jpg/')
    img.onload = () => resolve(img)
    img.onerror = () => {
      const img2 = new Image()
      img2.crossOrigin = 'anonymous'
      img2.onload = () => resolve(img2)
      img2.onerror = () => resolve(null)
      img2.src = collageFotos[idx].url
    }
    img.src = url
  })))

  dibuixarCollage(imgs.filter(Boolean), sala, ciutat)
  btn.textContent = 'Generar Story'
  btn.disabled = false
  tancarCollage()
}

async function dibuixarCollage(imgs, sala, ciutat) {
  const W = 1080, H = 1920
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const ctx = canvas.getContext('2d')

    const bg = new Image()
    bg.onload = () => {
      const bgAR = bg.width / bg.height
      const cAR = W / H

      if(bgAR > cAR) { bH=H; bW=H*bgAR; bX=(W-bW)/2; bY=0 }

  let rng = seed
  const rand = () => { rng = (rng * 1664525 + 1013904223) & 0xffffffff; return (rng >>> 0) / 0xffffffff }

  const positions = imgs.map((_, i) => {
    const isLast = i === imgs.length - 1
    const isOdd = imgs.length % 2 !== 0
    // Si és l'última i el total és imparell, forçar columna dreta
    const col = (isLast && isOdd) ? 1 : i % cols
    const row = Math.floor(i / cols)
    const cx = cellW * col + cellW / 2
    const cy = zoneTop + cellH * row + cellH / 2
    const jitterX = (rand() - 0.5) * cellW * 0.25
    const jitterY = (rand() - 0.5) * cellH * 0.25
    const angle = (rand() - 0.5) * 12 * Math.PI / 180
    return { x: cx - polSize/2 + jitterX, y: cy - (polSize+polBottom)/2 + jitterY, angle }
  })

  // Dibuixar polaroids en ordre (les últimes a sobre)
  for(let i = 0; i < imgs.length; i++) {
    const img = imgs[i]
    const { x, y, angle } = positions[i]
    const pH = polSize + polBottom

    ctx.save()
    ctx.translate(x + polSize/2, y + pH/2)
    ctx.rotate(angle)

    // Ombra
    ctx.shadowColor = 'rgba(0,0,0,0.6)'
    ctx.shadowBlur = 25
    ctx.shadowOffsetY = 10

    // Fons blanc polaroid
    ctx.fillStyle = '#ffffff'
    ctx.fillRect(-polSize/2, -pH/2, polSize, pH)
    ctx.shadowColor = 'transparent'

    // Foto (object-fit cover)
    const margin = 15
    const dW = polSize - margin*2
    const dH = imgSize - margin
    const srcAR = img.naturalWidth / img.naturalHeight
    let sX=0, sY=0, sW=img.naturalWidth, sH=img.naturalHeight
    if(srcAR > 1) { sW=img.naturalHeight; sX=(img.naturalWidth-sW)/2 }
    else if(srcAR < 1) { sH=img.naturalWidth; sY=(img.naturalHeight-sH)/2 }
    ctx.drawImage(img, sX, sY, sW, sH, -polSize/2+margin, -pH/2+margin, dW, dH)

    // Peu de foto: nom i comentari
    const foto = collageFotos[collageSeleccio[i]]
    const footY = pH/2 - polBottom + 22
    ctx.font = 'bold 22px Arial'
    ctx.fillStyle = '#222222'
    ctx.textAlign = 'center'
    const nomText = foto?.label || ''
    ctx.fillText(nomText.length > 22 ? nomText.slice(0,22)+'…' : nomText, 0, footY)
    if(foto?.comentari) {
      ctx.font = 'italic 19px Arial'
      ctx.fillStyle = '#666666'
      const cmText = foto.comentari
      ctx.fillText(cmText.length > 26 ? cmText.slice(0,26)+'…' : cmText, 0, footY + 28)
    }

    ctx.restore()
  }

  // Franja inferior: logo + info + URL
  const botY = zoneBot + 20

  // Logo
  await new Promise(resolve => {
    const logoImg = new Image()
    logoImg.onload = () => {
      const lW = 260, lH = Math.round(logoImg.height * lW / logoImg.width)
      // Dibuixar logo en blanc usant compositing
    const offscreen = document.createElement('canvas')
    offscreen.width = lW; offscreen.height = lH
    const octx = offscreen.getContext('2d')
    octx.drawImage(logoImg, 0, 0, lW, lH)
    octx.globalCompositeOperation = 'source-in'
    octx.fillStyle = '#ffffff'
    octx.fillRect(0, 0, lW, lH)
    ctx.drawImage(offscreen, 60, botY)

      ctx.font = 'bold 36px Arial'
      ctx.fillStyle = '#ffffff'
      ctx.textAlign = 'left'
      ctx.fillText(sala, 60, botY + lH + 48)

      ctx.font = '30px Arial'
      ctx.fillStyle = 'rgba(255,255,255,0.65)'
      ctx.fillText(ciutat, 60, botY + lH + 88)

      // Línia rosa
      ctx.strokeStyle = '#FF66FF'
      ctx.lineWidth = 3
      ctx.beginPath()
      ctx.moveTo(60, botY + lH + 110)
      ctx.lineTo(W - 60, botY + lH + 110)
      ctx.stroke()

      ctx.font = '30px Arial'
      ctx.fillStyle = 'rgba(255,255,255,0.8)'
      ctx.fillText('Sigue la gira en directo ↓', 60, botY + lH + 152)

      ctx.font = 'bold 34px Arial'
      ctx.fillStyle = '#FF66FF'
      ctx.fillText('carmen113tour.vercel.app', 60, botY + lH + 196)

      const link = document.createElement('a')
      link.download = 'carmen113-collage.jpg'
      link.href = canvas.toDataURL('image/jpeg', 0.92)
      link.click()
      resolve()

async function generarStoryFan(cloudinaryUrl, autorNom, comentari) {
  const sala = document.getElementById('header-sala')?.textContent || ''
  const ciutat = document.getElementById('header-city')?.textContent || ''

  const imgUrl = cloudinaryUrl.replace('/upload/', '/upload/w_1200,q_90,f_jpg/')
  const img = new Image()
  img.crossOrigin = 'anonymous'

  img.onerror = () => {
    const img2 = new Image()
    img2.crossOrigin = 'anonymous'
    img2.onload = () => dibuixarStoryFan(img2, autorNom, comentari, sala, ciutat)
    img2.onerror = () => alert('No se ha podido cargar la imagen')
    img2.src = cloudinaryUrl
  }
  img.onload = () => dibuixarStoryFan(img, autorNom, comentari, sala, ciutat)
  img.src = imgUrl
}

async function dibuixarStoryFan(img, autorNom, comentari, sala, ciutat) {

      else{bw=W;bh=W/ar;bx=0;by=(H-bh)/2}

      ctx.fillRect(0,0,W,H)

  const tY = polY + INNER + destH

  ctx.textAlign = 'left'

  ctx.strokeStyle = '#FF66FF'
  ctx.lineWidth = 3

  ctx.moveTo(tX, sepY)

  ctx.stroke()

  ctx.fillStyle = '#333333'
  ctx.fillText((sala + ' · ' + ciutat).length > 40 ? (sala + ' · ' + ciutat).slice(0,40)+'…' : sala + ' · ' + ciutat, tX, sepY + 40)

  ctx.fillText('carmen113tour.vercel.app', tX, sepY + 78)

      octx.fillStyle = '#ffffff'

function obrirModal(url) {
  const modal = document.getElementById('modal-foto')
  const img = document.getElementById('modal-img')
  img.src = url.replace('/upload/w_600,q_80,f_webp/', '/upload/w_1600,q_90,f_webp/')
              .replace('/upload/w_1200,q_80,f_webp/', '/upload/w_1600,q_90,f_webp/')
  modal.classList.add('open')
  document.body.style.overflow = 'hidden'
}

function tancarModal() {
  document.getElementById('modal-foto').classList.remove('open')
  document.body.style.overflow = ''
}

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') tancarModal() })

// ─── COMPARTIR APP ───────────────────────────────────────────────────────────
async function compartirApp() {
  const url = 'https://carmen113tour.vercel.app'
  const text = 'Sigue la gira de Carmen 113 en directo — Mañanas de Euforia'
  if(navigator.share) {
    try {
      await navigator.share({ title: 'Carmen 113 · Mañanas de Euforia', text, url })
    } catch(e) {}
  } else {
    // Fallback: copiar al portapapers
    try {
      await navigator.clipboard.writeText(url)
      alert('Enlace copiado: ' + url)
    } catch(e) {
      prompt('Copia este enlace:', url)
    }
  }
}
