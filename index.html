<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carmen 113 — Road</title>
<link rel="manifest" id="pwa-manifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="C113 Road">
<link rel="apple-touch-icon" id="apple-touch-icon-link">
<link rel="icon" type="image/png" sizes="32x32" id="favicon-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root {
    --black: #000000;
    --white: #ffffff;
    --accent: #ff66ff;
    --grey-dark: #111111;
    --grey-mid: #333333;
    --grey-text: #888888;
    --border: #222222;
    --nav-h: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geologica', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    padding-bottom: calc(var(--nav-h) + 72px);
    -webkit-font-smoothing: antialiased;
  }

  /* === HEADER === */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--black);
    z-index: 100;
  }

  .app-logo {
    height: 22px;
    filter: invert(1);
  }

  .lang-toggle {
    display: flex;
    gap: 2px;
    background: var(--grey-mid);
    border-radius: 6px;
    padding: 3px;
  }

  .lang-btn {
    background: none;
    border: none;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s, color 0.15s;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #ffffff;
  }

  /* === VIEWS === */
  .view { display: none; padding: 0 0 8px; }
  .view.active { display: block; }

  /* === HOME === */
  .next-concert {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .next-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .next-title {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .next-subtitle {
    font-size: 16px;
    font-weight: 500;
    color: var(--grey-text);
    margin-bottom: 20px;
  }

  .countdown-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .countdown-unit {
    text-align: center;
  }

  .countdown-num {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .countdown-unit-label {
    font-size: 10px;
    color: var(--grey-text);
    font-weight: 500;
    margin-top: 2px;
  }

  .countdown-sep {
    font-size: 32px;
    font-weight: 300;
    color: var(--grey-mid);
    line-height: 1;
    padding-top: 2px;
  }

  .next-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .info-cell {
    background: var(--grey-dark);
    padding: 14px 16px;
  }

  .info-cell-label {
    font-size: 10px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .info-cell-value {
    font-size: 14px;
    font-weight: 600;
  }

  .info-cell-value.yellow { color: var(--accent); }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 8px;
  }

  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: none;
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }

  /* Quick schedule */
  .home-section {
    padding: 20px 20px 0;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--grey-text);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .schedule-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .schedule-row:last-child { border-bottom: none; }

  .schedule-time {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    min-width: 52px;
  }

  .schedule-event {
    flex: 1;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 500;
  }

  .schedule-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--grey-text);
  }

  .schedule-badge.key {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* === CONCERT LIST === */
  .concerts-list { padding: 16px 20px; }

  .concert-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .concert-card:active { border-color: var(--accent); }

  .concert-card-top {
    display: flex;
    align-items: stretch;
  }

  .concert-date-block {
    background: var(--grey-dark);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    border-right: 1px solid var(--border);
  }

  .concert-date-day {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .concert-date-month {
    font-size: 10px;
    font-weight: 600;
    color: var(--grey-text);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .concert-info {
    flex: 1;
    padding: 14px 16px;
  }

  .concert-city {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .concert-venue {
    font-size: 13px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .concert-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--grey-text);
  }

  .tag.next {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .concert-arrow {
    display: flex;
    align-items: center;
    padding: 0 16px;
    color: var(--grey-text);
    font-size: 18px;
  }

  /* === CONCERT DETAIL === */
  .detail-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-back {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grey-text);
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 16px;
    background: none;
    border: none;
    padding: 0;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
  }

  .detail-date-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .detail-title {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .detail-venue {
    font-size: 16px;
    color: var(--grey-text);
    font-weight: 500;
  }

  .detail-section {
    padding: 20px 20px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  /* Horaris */
  .horari-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .horari-row:last-child { border-bottom: none; }

  .horari-time {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    min-width: 48px;
    font-variant-numeric: tabular-nums;
  }

  .horari-label {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }

  .horari-sub {
    font-size: 12px;
    color: var(--grey-text);
    margin-top: 2px;
  }

  /* Calculadora sortida */
  .calc-box {
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
  }

  .calc-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--grey-text);
    margin-bottom: 12px;
  }

  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .calc-row:last-child { border-bottom: none; }

  .calc-row label { color: var(--grey-text); }

  .calc-row input, .calc-row select {
    background: var(--grey-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 10px;
    width: 90px;
    text-align: right;
  }

  .calc-result {
    margin-top: 12px;
    padding: 12px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .calc-result-label {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }

  .calc-result-time {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  /* Localitzacions */
  .loc-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .loc-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    background: var(--grey-mid);
  }

  .loc-img-placeholder {
    width: 100%;
    height: 80px;
    background: var(--grey-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .loc-body {
    padding: 12px 14px;
  }

  .loc-type {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey-text);
    margin-bottom: 4px;
  }

  .loc-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .loc-addr {
    font-size: 12px;
    color: var(--grey-text);
    margin-bottom: 10px;
  }

  .btn-maps {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    border-radius: 6px;
    padding: 6px 12px;
    text-decoration: none;
  }

  /* Capçalera de secció amb botons */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-header .section-title {
    margin-bottom: 0;
  }
  .section-btns {
    display: flex;
    gap: 6px;
  }
  .btn-section {
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.04em;
  }
  .btn-section.filled {
    background: var(--accent);
    color: #000;
  }

  /* Gastro spots */
  .gastro-list { margin-top: 10px; }
  .gastro-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .gastro-card:last-child { border-bottom: none; }
  .gastro-dist {
    min-width: 44px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .gastro-dist span { display: block; font-size: 9px; font-weight: 400; color: var(--grey-text); }
  .gastro-info { flex: 1; min-width: 0; }
  .gastro-nom {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gastro-meta {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 2px;
  }
  .gastro-rating { color: var(--accent); font-weight: 700; }
  .gastro-notes {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 3px;
    font-style: italic;
    line-height: 1.4;
  }
  .gastro-maps {
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    border-radius: 6px;
    padding: 6px 10px;
    text-decoration: none;
    white-space: nowrap;
  }
  .gastro-loading {
    text-align: center;
    padding: 20px;
    color: var(--grey-text);
    font-size: 13px;
  }

  /* Despeses */
  .despesa-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .despesa-row:last-child { border-bottom: none; }

  .despesa-icon {
    font-size: 18px;
    width: 32px;
    text-align: center;
  }

  .despesa-info { flex: 1; }

  .despesa-desc {
    font-size: 14px;
    font-weight: 500;
  }

  .despesa-who {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 1px;
  }

  .despesa-amount {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .despesa-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 0;
    font-weight: 700;
  }

  .despesa-total-label {
    font-size: 13px;
    color: var(--grey-text);
  }

  .despesa-total-amount {
    font-size: 22px;
    color: var(--accent); /* magenta */
    font-variant-numeric: tabular-nums;
  }

  /* Add despesa form */
  .add-form {
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
    display: none;
  }

  .add-form.open { display: block; }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .form-input {
    flex: 1;
    background: var(--grey-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
  }

  .form-input::placeholder { color: var(--grey-text); }

  .form-input:focus {
    outline: 1px solid var(--accent);
    outline-offset: -1px;
  }

  .form-submit {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }

  .btn-add {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    margin-top: 12px;
  }

  /* === NAV === */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--nav-h) + 52px);
    background: var(--black);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    padding-top: 6px;
    z-index: 10000;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px 0 0;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    transition: color 0.15s;
  }

  .nav-item.active { color: var(--accent); }

  .nav-icon { font-size: 20px; line-height: 1; }

  .nav-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* === CALENDAR VIEW === */
  .cal-month { padding: 16px 20px 0; }

  .cal-month-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--grey-text);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .cal-concert-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .cal-concert-row:last-child { border-bottom: none; }

  .cal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .cal-date {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    color: var(--grey-text);
  }

  .cal-info { flex: 1; }

  .cal-city {
    font-size: 15px;
    font-weight: 700;
  }

  .cal-venue {
    font-size: 12px;
    color: var(--grey-text);
  }

  /* === DOCS VIEW === */
  .docs-section { padding: 16px 20px 0; }

  .doc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .doc-row:last-child { border-bottom: none; }

  .doc-icon {
    width: 36px;
    height: 36px;
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .doc-info { flex: 1; }

  .doc-name {
    font-size: 14px;
    font-weight: 600;
  }

  .doc-meta {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 2px;
  }

  .doc-type {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--grey-mid);
    color: var(--grey-text);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* === UTILS === */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--grey-text);
    font-size: 14px;
  }

  .empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* Category pills */
  .pills-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }

  .pills-row::-webkit-scrollbar { display: none; }

  .pill {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    background: none;
    color: var(--grey-text);
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
    transition: all 0.15s;
  }

  .pill.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Concerts filter per mes */
  .month-header {
    padding: 16px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--grey-text);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  /* emoji selector despeses */
  .emoji-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .emoji-opt {
    font-size: 20px;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    transition: background 0.1s;
  }

  .emoji-opt.selected {
    background: var(--grey-mid);
    border-color: var(--accent);
  }

  /* === HOME BANNER === */
  .home-banner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    padding: 20px 20px 0;
  }

  .home-banner-left { flex: 1; }

  .home-banner-city {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 2px;
  }

  .home-banner-venue {
    font-size: 14px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .home-banner-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .home-banner-meta span {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }

  .home-banner-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .home-banner-date {
    background: var(--accent);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 64px;
  }

  .home-banner-day {
    font-size: 28px;
    font-weight: 800;
    color: #000;
    line-height: 1;
  }

  .home-banner-month {
    font-size: 11px;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .home-cd {
    font-size: 12px;
    font-weight: 700;
    color: var(--grey-text);
    text-align: center;
    line-height: 1.4;
  }

  .cd-num {
    font-size: 14px;
    font-weight: 800;
    color: var(--white);
    font-variant-numeric: tabular-nums;
  }

  .cd-sep {
    font-size: 11px;
    color: var(--grey-text);
    margin: 0 2px;
  }

  .home-list-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--grey-text);
    text-transform: uppercase;
    padding: 20px 20px 0;
    margin-bottom: 4px;
  }

  /* === MODE PÚBLIC === */
  .public-view {
    padding: 0 20px;
  }

  .public-header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .public-logo {
    height: 28px;
    filter: invert(1);
    margin-bottom: 16px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .public-tour-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .public-concert-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .public-concert-row:last-child { border-bottom: none; }

  .public-date-block {
    flex-shrink: 0;
    width: 48px;
    text-align: center;
  }

  .public-date-day {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .public-date-month {
    font-size: 10px;
    font-weight: 600;
    color: var(--grey-text);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .public-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
    flex-shrink: 0;
  }

  .public-city {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.1;
  }

  .public-venue {
    font-size: 12px;
    color: var(--grey-text);
    font-weight: 400;
    margin-top: 3px;
  }

  .public-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .public-dot.past { background: var(--grey-mid); }

  .crew-mode-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000000;
    border-top: 1px solid var(--border);
    padding: 12px 20px 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 9999;
    font-size: 12px;
    color: var(--grey-text);
  }

  .crew-mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
  }

  /* Separator */
  hr.sep {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }

  /* Totals strip */
  .strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  .strip-label { font-size: 12px; color: var(--grey-text); font-weight: 500; }
  .strip-val { font-size: 14px; font-weight: 700; }


  /* === CHAT === */
  .chat-view {
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--nav-h) - 109px);
  }

  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-concert-sel {
    flex: 1;
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    appearance: none;
    -webkit-appearance: none;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .chat-msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }

  .chat-msg.mine { align-self: flex-end; align-items: flex-end; }
  .chat-msg.theirs { align-self: flex-start; align-items: flex-start; }

  .chat-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
    word-break: break-word;
  }

  .chat-msg.mine .chat-bubble {
    background: var(--accent);
    color: #000;
    border-bottom-right-radius: 4px;
  }

  .chat-msg.theirs .chat-bubble {
    background: var(--grey-dark);
    border: 1px solid var(--border);
    color: var(--white);
    border-bottom-left-radius: 4px;
  }

  .chat-meta {
    font-size: 10px;
    color: var(--grey-text);
    margin-top: 3px;
    padding: 0 4px;
  }

  .chat-footer {
    padding: 10px 16px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--black);
  }

  .chat-input {
    flex: 1;
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 22px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    padding: 10px 16px;
    outline: none;
  }

  .chat-input:focus { border-color: var(--accent); }

  .chat-send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .chat-author-bar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--grey-text);
  }

  .chat-author-input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 2px 4px;
    width: 120px;
    outline: none;
  }

  /* === PANTALLA BENVINGUDA === */
  .welcome-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .welcome-logo {
    height: 28px;
    filter: invert(1);
    margin-bottom: 40px;
  }

  .welcome-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--grey-text);
    text-transform: uppercase;
    margin-bottom: 32px;
    text-align: center;
  }

  .members-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }

  .member-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--grey-dark);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 14px 8px;
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
    transition: border-color 0.15s, background 0.15s;
  }

  .member-btn:active {
    border-color: var(--accent);
    background: #1a001a;
  }

  .member-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--grey-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -1px;
  }

  .member-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--white);
    text-align: center;
  }

  /* Chat: indicador nom actiu */
  .chat-who-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
  }

  /* Loading skeleton */
  .skeleton {
    background: var(--grey-dark);
    border-radius: 8px;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .skeleton-row {
    height: 72px;
    margin-bottom: 10px;
  }

  .skeleton-banner {
    height: 160px;
    margin: 20px;
    border-radius: 12px;
  }

</style>
</head>

  const m = currentLang === 'ca' ? MESOS_CA[d.getMonth()] : MESOS_ES[d.getMonth()];
  const dia = currentLang === 'ca' ? DIES_CA[d.getDay()] : DIES_ES[d.getDay()];
  return `${dia}, ${d.getDate()} ${m} ${d.getFullYear()}`;
}

function formatDataCurta(d) {
  const m = currentLang === 'ca' ? MESOS_CA[d.getMonth()] : MESOS_ES[d.getMonth()];
  return `${d.getDate()} ${m}`;
}

function msToCountdown(ms) {
  if (ms <= 0) return { d: 0, h: 0, m: 0, s: 0 };
  const s = Math.floor(ms / 1000);
  return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
}

function calcHoraSortida(loadIn, km, extraMin = 30) {
  const [h, m] = loadIn.split(':').map(Number);
  const loadInMin = h * 60 + m;
  const viatge = Math.ceil((km / 90) * 60 * 1.1);
  const parades = Math.floor(km / 180) * 20;
  const total = viatge + parades + extraMin;
  const sortMin = ((loadInMin - total) % 1440 + 1440) % 1440;
  return `${pad(Math.floor(sortMin / 60))}:${pad(sortMin % 60)}`;
}

function tipusLabel(t) {
  const map = {
    ca: { venue: 'Sala', allotjament: 'Allotjament', restaurant: 'On menjar', parking: 'Parking' },
    es: { venue: 'Sala', allotjament: 'Alojamiento', restaurant: 'Donde comer', parking: 'Parking' }
  };
  return map[currentLang][t] || t;
}

function nextConcert() {
  const now = new Date();
  return CONCERTS.find(c => c.dataObj >= now) || CONCERTS[CONCERTS.length - 1];
}

function docIcon(t) {
  return { contracte: '📋', rider: '🎛', dni: '🪪', altres: '📄' }[t] || '📄';
}

function formatHour(s) {
  if (!s) return '--:--';
  return s.slice(0, 5);
}

function timeAgo(iso) {
  const d = new Date(iso);
  const diff = Math.floor((Date.now() - d) / 1000);
  if (diff < 60) return 'ara mateix';
  if (diff < 3600) return `fa ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `fa ${Math.floor(diff/3600)} h`;
  return d.toLocaleDateString('ca');
}

function showView(name) {

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

  document.getElementById('view-' + name).classList.add('active');

    CONCERTS = data.map(c => ({
      ...c,
      dataObj: parseData(c.data),

let countdownInterval = null;

function renderHome() {
  if (!CONCERTS.length) return;
  const c = nextConcert();
  const now = new Date();

  function updateCountdown() {
    const diff = c.dataObj - new Date();
    const { d, h, m } = msToCountdown(diff);
    const el = document.getElementById('countdown-display');
    if (!el) return;
    if (diff > 0) {
      el.innerHTML = `<span class="cd-num">${d}</span><span class="cd-sep">d</span><span class="cd-num">${pad(h)}</span><span class="cd-sep">h</span><span class="cd-num">${pad(m)}</span><span class="cd-sep">m</span>`;
    } else {
      el.innerHTML = `<span style="color:var(--accent);font-weight:700">${currentLang === 'ca' ? 'Avui!' : 'Hoy!'}</span>`;
    }
  }

  const sortida = calcHoraSortida(c.loadIn, c.distanciaKm);
  const mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(ORIGEN)}&destination=${encodeURIComponent(c.adreca || c.sala + ' ' + c.ciutat)}&travelmode=driving`;
  const mes = (currentLang === 'ca' ? MESOS_CA : MESOS_ES)[c.dataObj.getMonth()].replace('.','');

  document.getElementById('home-next').innerHTML = `
    <div class="home-banner" onclick="showDetail(${c.id})">
      <div class="home-banner-left">
        <div class="next-label">${currentLang === 'ca' ? 'Proper concert' : 'Proximo concierto'}</div>
        <div class="home-banner-city">${c.ciutat}</div>
        <div class="home-banner-venue">${c.sala}</div>
        <div class="home-banner-meta">
          <span>🎸 ${c.setTime}</span>
          <span>📍 ${c.distanciaKm} km</span>
          <span>🚗 ${currentLang === 'ca' ? 'Sortida' : 'Salida'} ${sortida}</span>
        </div>
      </div>
      <div class="home-banner-right">
        <div class="home-banner-date">
          <div class="home-banner-day">${c.dataObj.getDate()}</div>
          <div class="home-banner-month">${mes}</div>
        </div>
        <div id="countdown-display" class="home-cd"></div>

  updateCountdown();

  // Llistat complet
  const upcoming = CONCERTS.filter(x => x.dataObj >= now);
  const past     = CONCERTS.filter(x => x.dataObj < now);
  const propersL = currentLang === 'ca' ? 'Propers' : 'Proximos';
  const passatsL = currentLang === 'ca' ? 'Passats' : 'Pasados';

  let listHTML = `<div class="home-list-title">${totsL}</div>`;
  if (upcoming.length) {
    listHTML += `<div class="month-header">${propersL}</div>`;
    listHTML += upcoming.map((x, i) => concertCard(x, i === 0)).join('');
  }
  if (past.length) {
    listHTML += `<div class="month-header">${passatsL}</div>`;
    listHTML += past.map(x => concertCard(x, false, true)).join('');
  }
  document.getElementById('home-schedule').innerHTML = listHTML;

  const adreca = document.getElementById('loc-adreca').value.trim();

      method: 'POST',
      body: JSON.stringify({ concert_id: concertId, tipus, nom, adreca: adreca || null, ordre: 99 })
    });
    renderDetail(concertId);
  } catch(e) { console.error(e); }
}

function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function mostrarGastroPropers(concertId, venueLat, venueLng) {
  const panel = document.getElementById(`gastro-panel-${concertId}`);
  if (!panel) return;

  // Si ja és obert, tancar
  if (panel.dataset.open === '1') {
    panel.innerHTML = '';
    panel.dataset.open = '0';
    return;
  }

  panel.innerHTML = `<div class="gastro-loading">📍 ${currentLang === 'ca' ? 'Obtenint posició...' : 'Obteniendo posición...'}</div>`;
  panel.dataset.open = '1';

  // Obtenir posició GPS
  let userLat, userLng;
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout:8000}));
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
  } catch(e) {
    // Fallback: coordenades del venue si les tenim, si no error
    if (venueLat && venueLng) {
      userLat = venueLat;
      userLng = venueLng;
      panel.innerHTML += `<div style="font-size:11px;color:var(--grey-text);padding:4px 0">${currentLang === 'ca' ? '(Usant ubicació del venue)' : '(Usando ubicación del venue)'}</div>`;
    } else {
      panel.innerHTML = `<div class="gastro-loading">${currentLang === 'ca' ? 'No s\'ha pogut obtenir la posició.' : 'No se pudo obtener la posición.'}</div>`;
      return;
    }
  }

  // Carregar spots de Supabase
  let spots = [];
  try {
    spots = await sbFetch('/rest/v1/gastro_spots?select=*');
  } catch(e) {
    panel.innerHTML = `<div class="gastro-loading">${currentLang === 'ca' ? 'Error carregant restaurants.' : 'Error cargando restaurantes.'}</div>`;
    return;
  }

  // Calcular distàncies i filtrar < 40km
  const propers = spots
    .map(s => ({ ...s, km: distKm(userLat, userLng, parseFloat(s.lat), parseFloat(s.lng)) }))
    .filter(s => s.km < 40)
    .sort((a, b) => a.km - b.km);

  if (!propers.length) {
    panel.innerHTML = `<div class="gastro-loading">${currentLang === 'ca' ? 'Cap restaurant a menys de 40 km.' : 'Ningún restaurante a menos de 40 km.'}</div>`;
    return;
  }

  const mapsLink = s => `https://www.google.com/maps/search/${encodeURIComponent(s.nom + ' ' + (s.ciutat||''))}`;

  panel.innerHTML = `
    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey-text);margin-bottom:10px">
        🍴 ${currentLang === 'ca' ? `${propers.length} restaurants a prop` : `${propers.length} restaurantes cerca`}
      </div>
      <div class="gastro-list">
        ${propers.map(s => `
          <div class="gastro-card">
            <div class="gastro-dist">${s.km < 1 ? '<1' : s.km.toFixed(1)}<span>km</span></div>
            <div class="gastro-info">
              <div class="gastro-nom">${s.nom}</div>
              <div class="gastro-meta">
                <span class="gastro-rating">★ ${s.rating || '—'}</span>
                ${s.preu ? ` · ${s.preu}` : ''}
                ${s.tipus ? ` · ${s.tipus}` : ''}
              </div>
              ${s.notes ? `<div class="gastro-notes">${s.notes}</div>` : ''}
            </div>
            <a href="${mapsLink(s)}" target="_blank" class="gastro-maps">📍 Maps</a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function recalc() {
  const li    = document.getElementById('calc-li').value;
  const km    = parseInt(document.getElementById('calc-km').value) || 0;
  const extra = parseInt(document.getElementById('calc-extra').value) || 0;
  const hora  = calcHoraSortida(li, km, extra);
  const res   = document.getElementById('calc-result');
  if (res) res.querySelector('.calc-result-time').textContent = hora;
}

function selectEmoji(e) {

async function addDespesa(concertId) {
  const desc   = document.getElementById('d-desc').value.trim();
  const qui    = document.getElementById('d-qui').value.trim();
  const imp    = parseFloat(document.getElementById('d-import').value);
  if (!desc || isNaN(imp)) return;
  try {
    await sbFetch('/rest/v1/despeses', {
      method: 'POST',
      body: JSON.stringify({ concert_id: concertId, emoji: despesesEmoji, descripcio: desc, qui: qui || null, import: imp })
    });
    renderDetail(concertId);
  } catch(e) { console.error(e); }
}

// CALENDAR
// ============================================================
function renderCalendar() {
  if (!CONCERTS.length) return;
  const now = new Date();
  const groups = {};
  CONCERTS.forEach(c => {
    const key = `${c.dataObj.getFullYear()}-${c.dataObj.getMonth()}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  let html = '';
  Object.keys(groups).sort().forEach(key => {
    const [y, mo] = key.split('-').map(Number);
    const mesLabel = (currentLang === 'ca' ? MESOS_FULL_CA : MESOS_FULL_ES)[mo];
    html += `<div class="cal-month"><div class="cal-month-title">${mesLabel} ${y}</div>`;
    groups[key].forEach(c => {
      const isPast = c.dataObj < now;
      html += `
        <div class="cal-concert-row" onclick="showDetail(${c.id})" style="${isPast ? 'opacity:0.45' : ''}">
          <div class="cal-dot" style="${isPast ? 'background:var(--grey-text)' : ''}"></div>
          <div class="cal-date">${formatDataCurta(c.dataObj)}</div>
          <div class="cal-info"><div class="cal-city">${c.ciutat}</div><div class="cal-venue">${c.sala}</div></div>
        </div>`;
    });
    html += '</div><hr class="sep">';
  });
  document.getElementById('calendar-content').innerHTML = html;
}

async function renderDocs() {
  document.getElementById('docs-list').innerHTML = '<div style="padding:20px"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>';
  try {
    const query = docsFilter === 'all'
      ? '/rest/v1/documents?concert_id=is.null&select=*&order=created_at.asc'
      : `/rest/v1/documents?concert_id=is.null&tipus=eq.${docsFilter}&select=*&order=created_at.asc`;

    const intro = currentLang === 'ca' ? 'Documents generals de la banda.' : 'Documentos generales de la banda.';
    document.getElementById('docs-list').innerHTML = `
      <p style="font-size:13px;color:var(--grey-text);padding:14px 20px 6px">${intro}</p>
      ${docs.length ? docs.map(d => `
        <div class="doc-row">
          <div class="doc-icon">${docIcon(d.tipus)}</div>

function populateChatSelect() {
  const sel = document.getElementById('chat-concert-sel');
  if (!sel) return;
  CONCERTS.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.dataObj.getDate()} ${MESOS_CA[c.dataObj.getMonth()].replace('.','')} — ${c.ciutat}`;
    sel.appendChild(opt);
  });
}

async function initChat() {
  updateWhoLabel();
  await loadChat();
}

async function loadChat() {
  const sel = document.getElementById('chat-concert-sel');
  const val = sel ? sel.value : 'general';
  chatConcertId = val === 'general' ? null : parseInt(val);
  disconnectRealtime();
  await fetchMessages();
  connectRealtime();
}

async function fetchMessages() {
  const query = chatConcertId
    ? `/rest/v1/missatges?concert_id=eq.${chatConcertId}&select=*&order=created_at.asc&limit=80`
    : `/rest/v1/missatges?concert_id=is.null&select=*&order=created_at.asc&limit=80`;
  try {
    const msgs = await sbFetch(query);
    renderMessages(msgs);
  } catch(e) { console.error(e); }
}

function renderMessages(msgs) {
  const myName = localStorage.getItem('c113_nom') || '';
  const el = document.getElementById('chat-messages');
  if (!el) return;
  if (!msgs.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div>${currentLang === 'ca' ? 'Inicieu la conversa!' : 'Iniciad la conversacion!'}</div>`;
    return;
  }
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = msgs.map(m => {
    const mine = myName && m.autor === myName;
    return `<div class="chat-msg ${mine ? 'mine' : 'theirs'}">
      <div class="chat-bubble">${m.text}</div>
      <div class="chat-meta">${mine ? '' : `${m.autor} · `}${timeAgo(m.created_at)}</div>
    </div>`;
  }).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

// Realtime WebSocket natiu de Supabase (sense llibreria)
let realtimeWs = null;

function connectRealtime() {
  disconnectRealtime();

  const wsUrl = SB_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SB_KEY + '&vsn=1.0.0';

  try {
    realtimeWs = new WebSocket(wsUrl);
  } catch(e) {
    console.warn('WebSocket no disponible:', e);
    return;
  }

  realtimeWs.onopen = () => {
    // Subscripció al canal de missatges filtrat
    const filterVal = chatConcertId ? `concert_id=eq.${chatConcertId}` : 'concert_id=is.null';
    const msg = JSON.stringify({
      topic: `realtime:public:missatges:${filterVal}`,
      event: 'phx_join',
      payload: { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: 'INSERT', schema: 'public', table: 'missatges', filter: filterVal }] } },
      ref: '1'
    });
    realtimeWs.send(msg);
    // Heartbeat cada 25s
    chatChannel = setInterval(() => {
      if (realtimeWs && realtimeWs.readyState === WebSocket.OPEN) {
        realtimeWs.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: '0' }));
      }
    }, 25000);
  };

  realtimeWs.onmessage = async (e) => {
    try {
      const data = JSON.parse(e.data);
      // Nou missatge inserit
      if (data.event === 'postgres_changes' && data.payload && data.payload.data && data.payload.data.type === 'INSERT') {
        await fetchMessages();
      }
    } catch(err) {}
  };

  realtimeWs.onerror = () => console.warn('Realtime WS error');
  realtimeWs.onclose = () => console.log('Realtime WS tancat');
}

function disconnectRealtime() {
  if (chatChannel) { clearInterval(chatChannel); chatChannel = null; }
  if (realtimeWs) {
    try { realtimeWs.close(); } catch(e) {}
    realtimeWs = null;
  }
}

async function sendMessage() {
  const input  = document.getElementById('chat-input');
  const author = localStorage.getItem('c113_nom') || '';
  const text   = input.value.trim();
  if (!text) return;
  if (!author) { showWelcome(); return; }
  input.value = '';
  try {
    await sbFetch('/rest/v1/missatges', {
      method: 'POST',
      body: JSON.stringify({ concert_id: chatConcertId, autor: author, text })
    });
    await fetchMessages();
  } catch(e) { console.error(e); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'chat-input') sendMessage();
});

function promptCrewAccess() {
  const token = prompt(`Codi d'accés:`);
  if (token === CREW_TOKEN) {
    localStorage.setItem('c113_crew', CREW_TOKEN);
    location.reload();
  } else if (token !== null) {
    alert('Codi incorrecte.');
  }
}
