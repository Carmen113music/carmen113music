<html lang="ca"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Carmen 113 · Mañanas de Euforia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#cc00cc;--pink-dim:#990099;--pink-bg:rgba(204,0,204,0.07);
  --black:#ffffff;--white:#111111;
  --g1:#f5f5f5;--g2:#ebebeb;--g3:#d8d8d8;--g4:#aaaaaa;--g5:#666666;--g6:#333333;
  --font:'Geologica',sans-serif;--r:10px;--rl:16px;--rs:4px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--black);color:var(--white);min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--g3)}
::-webkit-scrollbar-thumb{background:var(--g4);border-radius:2px}

/* LAYOUT */
.page{display:none;max-width:680px;margin:0 auto;padding:0 16px 80px}
.page.active{display:block}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;padding:24px 0 20px;border-bottom:1px solid var(--g2);margin-bottom:24px}
.logo{height:22px;filter:invert(0)}
.header-title{font-size:13px;color:var(--g5);flex:1}
.band-badge{font-size:10px;color:var(--pink);background:var(--pink-bg);border:1px solid rgba(255,102,255,.25);padding:3px 10px;border-radius:20px}
.back-btn{font-size:13px;color:var(--g5);transition:color .15s;padding:4px 0}
.back-btn:hover{color:var(--pink)}

/* CONCERTS */
.concerts-list{display:flex;flex-direction:column;gap:2px}
.concert-card{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:18px 14px;background:var(--g2);border-radius:var(--r);text-align:left;transition:background .15s;width:100%;border:1px solid transparent;cursor:pointer}
.concert-card:hover{background:var(--g3)}
.date-box{display:flex;flex-direction:column;align-items:center;gap:1px}
.date-dow{font-size:9px;font-weight:500;color:var(--g5);letter-spacing:.5px}
.date-num{font-size:24px;font-weight:300;line-height:1}
.date-mon{font-size:9px;font-weight:500;color:var(--g5);letter-spacing:.5px}
.concert-info{display:flex;flex-direction:column;gap:3px}
.concert-sala{font-size:14px;font-weight:500}
.concert-city{font-size:12px;color:var(--g5)}
.concert-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.concert-hora{font-size:12px;color:var(--g5)}
.btn-entrades{font-size:10px;color:var(--black);background:var(--pink);padding:4px 10px;border-radius:20px;font-weight:600}
.posts-count{font-size:10px;color:var(--pink)}

/* CONCERT PAGE */
.concert-header{padding:20px 0 28px}
.concert-header-date{font-size:11px;color:var(--g5);margin-bottom:6px;text-transform:capitalize}
.concert-header-sala{font-size:26px;font-weight:700;line-height:1.1;margin-bottom:4px}
.concert-header-city{font-size:15px;color:var(--g5)}
.timeline{display:flex;flex-direction:column;gap:10px}

/* POST CARD */
.post-card{background:var(--g2);border-radius:var(--rl);overflow:hidden;border:1px solid transparent}
.post-card.is-final{border-color:rgba(255,102,255,.3)}
.final-badge{background:var(--pink-bg);color:var(--pink);font-size:10px;font-weight:700;letter-spacing:.5px;padding:6px 16px;text-align:center}
.post-meta{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.post-autor{font-size:12px;font-weight:700;letter-spacing:.3px}
.post-hora{font-size:11px;color:var(--g5);flex:1}
.post-band-actions{display:flex;gap:4px}
.btn-band-action{font-size:11px;color:var(--g5);padding:3px 6px;border-radius:3px;transition:all .1s}
.btn-band-action:hover{background:var(--g3);color:var(--pink)}
.btn-delete:hover{color:#ff4444!important}
.post-text{font-size:14px;line-height:1.65;padding:2px 14px 14px}
.post-img{width:100%;height:auto;object-fit:cover}
.post-caption{font-size:12px;color:var(--g5);padding:8px 14px;font-style:italic}
.post-video-wrap{padding:0 0 4px}
.post-iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.ig-link{display:block;margin:4px 14px 10px}
.ig-preview{display:flex;align-items:center;gap:10px;background:var(--g3);border-radius:var(--r);padding:14px;color:var(--g6);font-size:13px}
.ig-icon{font-size:20px;color:var(--pink)}

/* COMENTARIS */
.comentaris-section{border-top:1px solid var(--g3);padding:10px 14px 12px}
.comentaris-toggle{font-size:11px;color:var(--g5);transition:color .1s}
.comentaris-toggle:hover{color:var(--pink)}
.comentaris-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.comentari-item{background:var(--g1);padding:8px 10px;border-radius:var(--rs);display:flex;flex-direction:column;gap:2px}
.comentari-autor{font-size:10px;font-weight:700;color:var(--pink)}
.comentari-text{font-size:12px;color:var(--g6);line-height:1.5}
.comentari-form{margin-top:8px;display:flex;flex-direction:column;gap:6px}

/* INPUTS */
.inp{background:var(--g1);border:1px solid var(--g3);color:var(--white);border-radius:var(--rs);padding:10px 12px;font-size:13px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--pink-dim)}
.inp::placeholder{color:var(--g4)}
textarea.inp{resize:none;line-height:1.5}

/* BUTTONS */
.btn-pink{background:var(--pink);color:var(--black);font-size:13px;font-weight:700;padding:10px 20px;border-radius:30px;transition:background .15s;width:100%}
.btn-pink:hover:not(:disabled){background:var(--pink-dim);color:var(--white)}
.btn-pink:disabled{opacity:.5;cursor:not-allowed}
.btn-gray{background:var(--g3);color:var(--white);font-size:12px;font-weight:500;padding:8px 16px;border-radius:20px;transition:background .15s}
.btn-gray:hover:not(:disabled){background:var(--pink);color:var(--black)}
.btn-gray:disabled{opacity:.5;cursor:not-allowed}
.btn-dashed{width:100%;padding:14px;border:1px dashed var(--g3);border-radius:var(--r);color:var(--g5);font-size:13px;transition:all .15s;text-align:center}
.btn-dashed:hover{border-color:var(--pink-dim);color:var(--pink)}

/* NOU POST FORM */
.nou-post-form{background:var(--g2);border-radius:var(--rl);padding:18px;border:1px solid rgba(255,102,255,.2);display:flex;flex-direction:column;gap:14px}
.form-header{display:flex;justify-content:space-between;align-items:center}
.form-title{font-size:13px;font-weight:700;color:var(--pink)}
.field-label{font-size:10px;font-weight:500;color:var(--g5);letter-spacing:.3px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--g3);color:var(--g5);transition:all .1s;cursor:pointer}
.chip:hover{border-color:var(--g5);color:var(--white)}
.chip.active{border-color:var(--pink)!important;color:var(--pink)!important;background:var(--pink-bg)}
.tipus-btns{display:flex;gap:5px}
.tipus-btn{flex:1;padding:10px 6px;border-radius:var(--rs);border:1px solid var(--g3);color:var(--g5);font-size:12px;transition:all .1s;cursor:pointer;text-align:center}
.tipus-btn:hover{border-color:var(--g5);color:var(--white)}
.tipus-btn.active{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.file-label{display:block;padding:12px;text-align:center;border:1px dashed var(--g3);border-radius:var(--rs);color:var(--g5);font-size:13px;cursor:pointer;transition:all .15s}
.file-label:hover{border-color:var(--pink-dim);color:var(--pink)}
.progress-bar{height:3px;background:var(--g3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--pink);transition:width .2s}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--g5);cursor:pointer}
input[type=checkbox]{accent-color:var(--pink);width:13px;height:13px}
input[type=file]{display:none}

/* APORTACIONS FANS */
.fans-section{margin-top:40px;padding-top:32px;border-top:1px solid rgba(255,102,255,.2)}
.fans-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.fans-title{font-size:15px;font-weight:500;color:var(--pink)}
.fans-count{font-size:11px;background:var(--pink-bg);color:var(--pink);border:1px solid rgba(255,102,255,.25);padding:2px 8px;border-radius:20px}
.fans-upload{background:var(--g2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.fans-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fan-item{border-radius:var(--rs);overflow:hidden;background:var(--g2);position:relative}
.fan-img{width:100%;height:180px;object-fit:cover;display:block}
.fan-video-link{display:flex;align-items:center;gap:8px;padding:12px;background:var(--g3);color:var(--g6);font-size:12px}
.fan-autor{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;font-size:10px;color:var(--white);background:linear-gradient(transparent,rgba(0,0,0,.7))}
.fan-comentari{padding:6px 8px;font-size:11px;color:var(--g5);font-style:italic;background:var(--g2)}

/* ERROR */
.err{font-size:11px;color:#ff6666}

/* EMPTY */
.empty{padding:40px 0;text-align:center;color:var(--g5);font-size:13px;line-height:1.7}

/* SKELETON */
.skeleton{height:80px;background:var(--g2);border-radius:var(--r);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

/* LOADING DOT */
.loading-dot{width:8px;height:8px;background:var(--pink);border-radius:50%;animation:shimmer 1s infinite;margin:120px auto}

/* MOBILE */
@media(max-width:480px){
  .concert-card{grid-template-columns:44px 1fr auto;gap:10px;padding:14px 10px}
  .date-num{font-size:20px}
  .fans-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://pztkayewglgthexnchov.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6dGtheWV3Z2xndGhleG5jaG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzkzODYsImV4cCI6MjEwNDM1NTM4Nn0.AqvN1j3BBuWsWOWVtC8XltLY9mehQXAsbwQ5X_JdL-4'
const BAND_TOKEN   = 'carmen113-mananas-de-euforia-2026'
const CLD_CLOUD    = 'yavl5m0q'
const CLD_PRESET   = 'carmen113_unsigned'
const MEMBRES      = ['Jaume','Jordi','Albert','Alfred','Roger','Rafa','Antonio','Sandra']
const MEMBRE_COLORS= {Jaume:'#FF66FF',Jordi:'#66FFCC',Albert:'#FFD966',Alfred:'#66CCFF',Roger:'#FF9966',Rafa:'#99FF66',Antonio:'#FF6699',Sandra:'#CC99FF'}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

// Detecta mode banda
const urlParams = new URLSearchParams(location.search)
const isBand = urlParams.get('band') === BAND_TOKEN
  || sessionStorage.getItem('bandToken') === BAND_TOKEN
if(isBand) sessionStorage.setItem('bandToken', BAND_TOKEN)

let currentConcertId = null
let realtimeChannel = null

// ─── AGENDA ──────────────────────────────────────────────────────────────────
async function loadAgenda() {
  if(isBand) document.getElementById('band-badge').style.display = 'inline'

  const { data: concerts } = await db.from('concerts').select('*').order('data', {ascending:true})
  const { data: postCounts } = await db.from('posts').select('concert_id')

  const countMap = {}
  postCounts?.forEach(p => { countMap[p.concert_id] = (countMap[p.concert_id]||0)+1 })

  const list = document.getElementById('concerts-list')
  list.innerHTML = ''

  concerts?.forEach(c => {
    const d = new Date(c.data + 'T00:00:00')
    const dow = d.toLocaleDateString('ca-ES',{weekday:'short'}).replace('.','').toUpperCase()
    const num = d.getDate()
    const mon = d.toLocaleDateString('ca-ES',{month:'short'}).replace('.','').toUpperCase()
    const count = countMap[c.id] || 0
    const hasEntrades = c.entrades_url ? `<a href="${c.entrades_url}" target="_blank" class="btn-entrades" onclick="event.stopPropagation()">Entrades</a>` : ''
    const postsLabel = count > 0 ? `<span class="posts-count">${count} post${count!==1?'s':''}</span>` : ''

    list.innerHTML += `
    <button class="concert-card" onclick="openConcert('${c.id}')">
      <div class="date-box">
        <span class="date-dow">${dow}</span>
        <span class="date-num">${num}</span>
        <span class="date-mon">${mon}</span>
      </div>
      <div class="concert-info">
        <span class="concert-sala">${c.sala}</span>
        <span class="concert-city">${c.ciutat}</span>
      </div>
      <div class="concert-right">
        <span class="concert-hora">${c.hora.slice(0,5)}</span>
        ${hasEntrades}
        ${postsLabel}
      </div>
    </button>`
  })
}

// ─── CONCERT PAGE ─────────────────────────────────────────────────────────────
async function openConcert(id) {
  currentConcertId = id
  document.getElementById('page-agenda').classList.remove('active')
  document.getElementById('page-concert').classList.add('active')
  document.getElementById('timeline').innerHTML = '<div class="loading-dot"></div>'
  document.getElementById('fans-section').innerHTML = ''
  document.getElementById('nou-post-container').style.display = 'none'
  if(isBand) document.getElementById('concert-band-badge').style.display='inline'

  // Carrega concert
  const { data: c } = await db.from('concerts').select('*').eq('id', id).single()
  const d = new Date(c.data + 'T00:00:00')
  document.getElementById('concert-data').textContent = d.toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
  document.getElementById('concert-sala').textContent = c.sala
  document.getElementById('concert-city').textContent = c.ciutat

  // Carrega posts + comentaris + aportacions
  await renderTimeline(id)

  // Nou post (banda)
  if(isBand) {
    document.getElementById('nou-post-container').style.display = 'block'
    renderNouPostForm()
  }

  // Realtime
  if(realtimeChannel) db.removeChannel(realtimeChannel)
  realtimeChannel = db.channel('concert-' + id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'posts', filter:`concert_id=eq.${id}`}, (payload) => { console.log('RT post INSERT', payload); renderTimeline(id) })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'posts', filter:`concert_id=eq.${id}`}, () => renderTimeline(id))
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'posts', filter:`concert_id=eq.${id}`}, () => renderTimeline(id))
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'comentaris'}, () => renderTimeline(id))
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'aportacions_fans', filter:`concert_id=eq.${id}`}, () => renderFansSection(id))
    .subscribe((status) => { console.log('Realtime status:', status) })
}

async function renderTimeline(concertId) {
  const { data: posts } = await db.from('posts').select('*').eq('concert_id', concertId).order('created_at', {ascending:true})
  const postIds = posts?.map(p=>p.id) || []
  const { data: comentaris } = postIds.length
    ? await db.from('comentaris').select('*').in('post_id', postIds).order('created_at', {ascending:true})
    : {data:[]}

  const tl = document.getElementById('timeline')
  if(!posts?.length) {
    tl.innerHTML = '<div class="empty">Aviat el grup penjarà la primera entrada des de la carretera.</div>'
    return
  }

  const cmMap = {}
  comentaris?.forEach(c => { if(!cmMap[c.post_id]) cmMap[c.post_id]=[]; cmMap[c.post_id].push(c) })

  tl.innerHTML = posts.map(p => renderPostCard(p, cmMap[p.id]||[])).join('')

  // Renderitza fans si hi ha post final
  const hiHaFinal = posts.some(p => p.es_final_concert)
  if(hiHaFinal) renderFansSection(concertId)
  else document.getElementById('fans-section').innerHTML = ''
}

function renderPostCard(p, comentaris) {
  const color = MEMBRE_COLORS[p.autor] || '#888'
  const hora = new Date(p.created_at).toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'})
  const finalBadge = p.es_final_concert ? '<div class="final-badge">✦ Final de concert</div>' : ''

  const bandActions = isBand ? `
    <div class="post-band-actions">
      <button class="btn-band-action" onclick="toggleFinal('${p.id}', ${!p.es_final_concert})" title="${p.es_final_concert?'Desmarcar':'Marcar com a final'}">
        ${p.es_final_concert ? '✦' : '○'}
      </button>
      <button class="btn-band-action btn-delete" onclick="deletePost('${p.id}')" title="Eliminar">✕</button>
    </div>` : ''

  let contingut = ''
  if(p.tipus === 'text') {
    contingut = `<p class="post-text">${escHtml(p.contingut||'')}</p>`
  } else if(p.tipus === 'foto' && p.cloudinary_url) {
    // Transformació Cloudinary: webp, q80, màx 1200px
    const url = p.cloudinary_url.replace('/upload/', '/upload/w_1200,q_80,f_webp/')
    contingut = `<img class="post-img" src="${url}" alt="Foto de ${p.autor}" loading="lazy">
    ${p.contingut ? `<p class="post-caption">${escHtml(p.contingut)}</p>` : ''}`
  } else if(p.tipus === 'video' && p.contingut) {
    contingut = renderVideoEmbed(p.contingut)
  }

  const cmHtml = comentaris.map(c => `
    <div class="comentari-item">
      <span class="comentari-autor">${escHtml(c.autor_nom)}</span>
      <span class="comentari-text">${escHtml(c.text)}</span>
    </div>`).join('')

  return `<article class="post-card${p.es_final_concert?' is-final':''}" id="post-${p.id}">
    ${finalBadge}
    <div class="post-meta">
      <span class="post-autor" style="color:${color}">${p.autor}</span>
      <span class="post-hora">${hora}</span>
      ${bandActions}
    </div>
    ${contingut}
    <div class="comentaris-section">
      <button class="comentaris-toggle" onclick="toggleComentaris('${p.id}')">
        ${comentaris.length > 0 ? comentaris.length + ' comentari' + (comentaris.length!==1?'s':'') : 'Comenta'} ↓
      </button>
      <div id="cm-${p.id}" style="display:none">
        <div class="comentaris-list" id="cm-list-${p.id}">${cmHtml}</div>
        <div class="comentari-form" style="margin-top:8px">
          <input class="inp" id="cm-nom-${p.id}" placeholder="El teu nom" maxlength="50">
          <textarea class="inp" id="cm-text-${p.id}" placeholder="Escriu un comentari..." rows="2" maxlength="500"></textarea>
          <p id="cm-err-${p.id}" class="err" style="display:none"></p>
          <button class="btn-gray" onclick="enviarComentari('${p.id}')" style="align-self:flex-end">Enviar</button>
        </div>
      </div>
    </div>
  </article>`
}

function renderVideoEmbed(url) {
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]+)/)
  if(yt) return `<div class="post-video-wrap"><iframe class="post-iframe" src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`
  const ig = url.match(/instagram\.com\/(p|reel|stories)\/([A-Za-z0-9_-]+)/)
  if(ig) return `<div class="post-video-wrap"><a href="${url}" target="_blank" class="ig-link"><div class="ig-preview"><span class="ig-icon">▶</span><span>Veure a Instagram</span></div></a></div>`
  return `<div class="post-video-wrap"><a href="${url}" target="_blank" class="ig-link"><div class="ig-preview"><span class="ig-icon">▶</span><span>Veure vídeo</span></div></a></div>`
}

// ─── FANS SECTION ─────────────────────────────────────────────────────────────
async function renderFansSection(concertId) {
  const { data: aportacions } = await db.from('aportacions_fans').select('*').eq('concert_id', concertId).order('created_at', {ascending:true})
  const count = aportacions?.length || 0

  const gridItems = (aportacions||[]).map(a => {
    let media = ''
    if(a.cloudinary_url) {
      const url = a.cloudinary_url.replace('/upload/', '/upload/w_600,q_80,f_webp/')
      media = `<img class="fan-img" src="${url}" alt="${escHtml(a.autor_nom)}" loading="lazy">`
    } else if(a.video_url) {
      const ig = a.video_url.match(/instagram\.com/)
      media = `<a href="${a.video_url}" target="_blank" class="fan-video-link"><span style="color:var(--pink)">▶</span> ${ig?'Story Instagram':'Veure vídeo'}</a>`
    }
    return `<div class="fan-item">
      ${media}
      ${a.comentari ? `<div class="fan-comentari">${escHtml(a.comentari)}</div>` : ''}
      <span class="fan-autor">${escHtml(a.autor_nom)}</span>
    </div>`
  }).join('')

  document.getElementById('fans-section').innerHTML = `
    <div class="fans-section">
      <div class="fans-header">
        <h2 class="fans-title">Fotos i vídeos dels fans</h2>
        <span class="fans-count">${count}</span>
      </div>
      <div class="fans-upload">
        <p style="font-size:12px;color:var(--g5);margin-bottom:2px">Afegeix la teva aportació del concert</p>
        <input type="file" id="fan-file" accept="image/*" capture="environment">
        <label for="fan-file" class="file-label">📷 Fer o seleccionar foto</label>
        <input class="inp" id="fan-video-url" placeholder="O enganxa l'URL de l'Story d'Instagram..." type="url">
        <textarea class="inp" id="fan-comentari" placeholder="Comentari (opcional)" rows="2" maxlength="300"></textarea>
        <input class="inp" id="fan-nom" placeholder="El teu nom o @usuari" maxlength="50">
        <div id="fan-progress" class="progress-bar" style="display:none"><div id="fan-progress-fill" class="progress-fill" style="width:0%"></div></div>
        <p id="fan-err" class="err" style="display:none"></p>
        <button class="btn-gray" id="fan-btn" onclick="enviarAportacioFan('${concertId}')" style="align-self:flex-end">Pujar</button>
      </div>
      ${count > 0 ? `<div class="fans-grid">${gridItems}</div>` : ''}
    </div>`
}

// ─── NOU POST FORM (BANDA) ────────────────────────────────────────────────────
let npTipus = 'text'
let npAutor = MEMBRES[0]

function renderNouPostForm(open=false) {
  const container = document.getElementById('nou-post-container')
  if(!open) {
    container.innerHTML = `<button class="btn-dashed" onclick="renderNouPostForm(true)">+ Afegir post</button>`
    return
  }

  const membresChips = MEMBRES.map(m => `<button class="chip${m===npAutor?' active':''}" onclick="selMembre('${m}')">${m}</button>`).join('')
  container.innerHTML = `
    <div class="nou-post-form">
      <div class="form-header">
        <span class="form-title">Nou post</span>
        <button class="btn-band-action" onclick="renderNouPostForm(false)">✕</button>
      </div>
      <div>
        <p class="field-label">Qui escriu</p>
        <div class="chips" id="membres-chips">${membresChips}</div>
      </div>
      <div>
        <p class="field-label">Tipus</p>
        <div class="tipus-btns">
          <button class="tipus-btn${npTipus==='text'?' active':''}" onclick="selTipus('text')">✍ Text</button>
          <button class="tipus-btn${npTipus==='foto'?' active':''}" onclick="selTipus('foto')">📷 Foto</button>
          <button class="tipus-btn${npTipus==='video'?' active':''}" onclick="selTipus('video')">▶ Vídeo</button>
        </div>
      </div>
      <div id="np-contingut"></div>
      <label class="checkbox-label"><input type="checkbox" id="np-final"> Marcar com a post final de concert</label>
      <p id="np-err" class="err" style="display:none"></p>
      <button class="btn-pink" id="np-btn" onclick="publicarPost()">Publicar</button>
    </div>`
  renderNpContingut()
}

function selMembre(m) {
  npAutor = m
  document.querySelectorAll('#membres-chips .chip').forEach(el => el.classList.toggle('active', el.textContent===m))
}

function selTipus(t) {
  npTipus = t
  document.querySelectorAll('.tipus-btn').forEach(el => el.classList.toggle('active', el.textContent.includes(t==='text'?'Text':t==='foto'?'Foto':'Vídeo')))
  renderNpContingut()
}

function renderNpContingut() {
  const el = document.getElementById('np-contingut')
  if(!el) return
  if(npTipus==='text') {
    el.innerHTML = `<textarea class="inp" id="np-text" placeholder="Escriu com va el dia..." rows="4"></textarea>`
  } else if(npTipus==='foto') {
    el.innerHTML = `
      <input type="file" id="np-file" accept="image/*" capture="environment">
      <label for="np-file" class="file-label">📷 Fer foto o seleccionar</label>
      <div id="np-progress" class="progress-bar" style="display:none"><div id="np-progress-fill" class="progress-fill" style="width:0%"></div></div>
      <textarea class="inp" id="np-caption" placeholder="Peu de foto (opcional)" rows="2" style="margin-top:6px"></textarea>`
  } else {
    el.innerHTML = `<input class="inp" id="np-video-url" placeholder="URL de l'Story, Reel d'Instagram o YouTube..." type="url">`
  }
}

async function publicarPost() {
  const btn = document.getElementById('np-btn')
  const errEl = document.getElementById('np-err')
  btn.disabled = true
  errEl.style.display = 'none'

  let cloudinary_url = null, cloudinary_public_id = null, contingut = null

  if(npTipus==='text') {
    contingut = document.getElementById('np-text')?.value?.trim()
    if(!contingut) { showErr('np-err','Escriu alguna cosa'); btn.disabled=false; return }
  } else if(npTipus==='foto') {
    const file = document.getElementById('np-file')?.files?.[0]
    if(!file) { showErr('np-err','Selecciona una foto'); btn.disabled=false; return }
    const res = await uploadCloudinary(file, 'carmen113/banda', 'np-progress-fill', 'np-progress')
    if(!res) { showErr('np-err','Error en pujar la foto'); btn.disabled=false; return }
    cloudinary_url = res.url
    cloudinary_public_id = res.public_id
    contingut = document.getElementById('np-caption')?.value?.trim() || null
  } else {
    contingut = document.getElementById('np-video-url')?.value?.trim()
    if(!contingut) { showErr('np-err',"Posa l'URL del vídeo"); btn.disabled=false; return }
  }

  const es_final = document.getElementById('np-final')?.checked || false
  const { error } = await db.from('posts').insert({
    concert_id: currentConcertId,
    autor: npAutor,
    tipus: npTipus,
    contingut,
    cloudinary_url,
    cloudinary_public_id,
    es_final_concert: es_final
  })

  if(error) { showErr('np-err', error.message); btn.disabled=false; return }
  renderNouPostForm(false)
}

// ─── ACCIONS BANDA ────────────────────────────────────────────────────────────
async function toggleFinal(postId, valor) {
  await db.from('posts').update({es_final_concert: valor}).eq('id', postId)
}

async function deletePost(postId) {
  if(!confirm('Eliminar aquest post?')) return
  await db.from('posts').delete().eq('id', postId)
}

// ─── COMENTARIS ───────────────────────────────────────────────────────────────
function toggleComentaris(postId) {
  const el = document.getElementById('cm-' + postId)
  const btn = el.previousElementSibling
  const vis = el.style.display === 'none'
  el.style.display = vis ? 'flex' : 'none'
  el.style.flexDirection = 'column'
  btn.textContent = btn.textContent.replace(vis?'↓':'↑', vis?'↑':'↓')
}

async function enviarComentari(postId) {
  const nom = document.getElementById('cm-nom-' + postId)?.value?.trim()
  const text = document.getElementById('cm-text-' + postId)?.value?.trim()
  if(!nom || !text) { showErr('cm-err-'+postId,'Posa el teu nom i el comentari'); return }
  const { data, error } = await db.from('comentaris').insert({post_id:postId, autor_nom:nom, text}).select().single()
  if(error) { showErr('cm-err-'+postId, error.message); return }
  const list = document.getElementById('cm-list-' + postId)
  list.innerHTML += `<div class="comentari-item"><span class="comentari-autor">${escHtml(data.autor_nom)}</span><span class="comentari-text">${escHtml(data.text)}</span></div>`
  document.getElementById('cm-text-' + postId).value = ''
}

// ─── APORTACIÓ FAN ────────────────────────────────────────────────────────────
async function enviarAportacioFan(concertId) {
  const btn = document.getElementById('fan-btn')
  const nom = document.getElementById('fan-nom')?.value?.trim()
  const videoUrl = document.getElementById('fan-video-url')?.value?.trim() || null
  const comentari = document.getElementById('fan-comentari')?.value?.trim() || null
  const file = document.getElementById('fan-file')?.files?.[0]

  if(!nom) { showErr('fan-err','Posa el teu nom'); return }
  if(!file && !videoUrl && !comentari) { showErr('fan-err','Afegeix una foto, un vídeo o un comentari'); return }

  btn.disabled = true
  let cloudinary_url = null, cloudinary_public_id = null
  if(file) {
    const res = await uploadCloudinary(file, 'carmen113/fans', 'fan-progress-fill', 'fan-progress')
    if(!res) { showErr('fan-err','Error en pujar la foto'); btn.disabled=false; return }
    cloudinary_url = res.url
    cloudinary_public_id = res.public_id
  }

  const { error } = await db.from('aportacions_fans').insert({concert_id:concertId, autor_nom:nom, cloudinary_url, cloudinary_public_id, video_url:videoUrl, comentari})
  if(error) { showErr('fan-err', error.message); btn.disabled=false; return }
  renderFansSection(concertId)
}


// ─── COMPRESSIÓ D'IMATGE ──────────────────────────────────────────────────────
function compressImage(file, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      URL.revokeObjectURL(url)
      const canvas = document.createElement('canvas')
      let w = img.width, h = img.height
      if(w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth }
      canvas.width = w; canvas.height = h
      const ctx = canvas.getContext('2d')
      ctx.drawImage(img, 0, 0, w, h)
      canvas.toBlob((blob) => {
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type:'image/jpeg'}))
      }, 'image/jpeg', quality)
    }
    img.src = url
  })
}

// ─── CLOUDINARY UPLOAD ────────────────────────────────────────────────────────
async function uploadCloudinary(file, folder, progressFillId, progressBarId) {
  const progressBar = document.getElementById(progressBarId)
  const progressFill = document.getElementById(progressFillId)
  if(progressBar) progressBar.style.display = 'block'

  const formData = new FormData()
  formData.append('file', file)
  formData.append('upload_preset', CLD_PRESET)

  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest()
    xhr.upload.onprogress = e => {
      if(e.lengthComputable && progressFill)
        progressFill.style.width = Math.round(e.loaded/e.total*100) + '%'
    }
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`)
    xhr.onload = () => {
      const d = JSON.parse(xhr.responseText)
      if(xhr.status===200) resolve({url: d.secure_url, public_id: d.public_id})
      else resolve(null)
    }
    xhr.onerror = () => resolve(null)
    xhr.send(formData)
  })
}

function showAgenda() {
  document.getElementById('page-concert').classList.remove('active')
  document.getElementById('page-agenda').classList.add('active')
  if(realtimeChannel) { db.removeChannel(realtimeChannel); realtimeChannel=null }
}

function showErr(id, msg) {
  const el = document.getElementById(id)
  if(!el) return
  el.textContent = msg
  el.style.display = 'block'
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
