<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carmen 113 — Road</title>
<link rel="manifest" id="pwa-manifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="C113 Road">
<link rel="apple-touch-icon" id="apple-touch-icon-link">
<link rel="icon" type="image/png" sizes="32x32" id="favicon-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --accent: #ff66ff;
    --grey-dark: #111111;
    --grey-mid: #333333;
    --grey-text: #888888;
    --border: #222222;
    --nav-h: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geologica', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    padding-bottom: calc(var(--nav-h) + 16px);
    -webkit-font-smoothing: antialiased;
  }

  /* === HEADER === */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--black);
    z-index: 100;
  }

  .app-logo {
    height: 22px;
    filter: invert(1);
  }

  .lang-toggle {
    display: flex;
    gap: 2px;
    background: var(--grey-mid);
    border-radius: 6px;
    padding: 3px;
  }

  .lang-btn {
    background: none;
    border: none;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s, color 0.15s;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #ffffff;
  }

  /* === VIEWS === */
  .view { display: none; padding: 0 0 8px; }
  .view.active { display: block; }

  /* === HOME === */
  .next-concert {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .next-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .next-title {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .next-subtitle {
    font-size: 16px;
    font-weight: 500;
    color: var(--grey-text);
    margin-bottom: 20px;
  }

  .countdown-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }

  .countdown-unit {
    text-align: center;
  }

  .countdown-num {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .countdown-unit-label {
    font-size: 10px;
    color: var(--grey-text);
    font-weight: 500;
    margin-top: 2px;
  }

  .countdown-sep {
    font-size: 32px;
    font-weight: 300;
    color: var(--grey-mid);
    line-height: 1;
    padding-top: 2px;
  }

  .next-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .info-cell {
    background: var(--grey-dark);
    padding: 14px 16px;
  }

  .info-cell-label {
    font-size: 10px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .info-cell-value {
    font-size: 14px;
    font-weight: 600;
  }

  .info-cell-value.yellow { color: var(--accent); }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 8px;
  }

  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: none;
    color: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }

  /* Quick schedule */
  .home-section {
    padding: 20px 20px 0;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--grey-text);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .schedule-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .schedule-row:last-child { border-bottom: none; }

  .schedule-time {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    min-width: 52px;
  }

  .schedule-event {
    flex: 1;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 500;
  }

  .schedule-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--grey-text);
  }

  .schedule-badge.key {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* === CONCERT LIST === */
  .concerts-list { padding: 16px 20px; }

  .concert-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .concert-card:active { border-color: var(--accent); }

  .concert-card-top {
    display: flex;
    align-items: stretch;
  }

  .concert-date-block {
    background: var(--grey-dark);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    border-right: 1px solid var(--border);
  }

  .concert-date-day {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .concert-date-month {
    font-size: 10px;
    font-weight: 600;
    color: var(--grey-text);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .concert-info {
    flex: 1;
    padding: 14px 16px;
  }

  .concert-city {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .concert-venue {
    font-size: 13px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .concert-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--grey-text);
  }

  .tag.next {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .concert-arrow {
    display: flex;
    align-items: center;
    padding: 0 16px;
    color: var(--grey-text);
    font-size: 18px;
  }

  /* === CONCERT DETAIL === */
  .detail-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-back {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grey-text);
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 16px;
    background: none;
    border: none;
    padding: 0;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
  }

  .detail-date-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .detail-title {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .detail-venue {
    font-size: 16px;
    color: var(--grey-text);
    font-weight: 500;
  }

  .detail-section {
    padding: 20px 20px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  /* Horaris */
  .horari-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .horari-row:last-child { border-bottom: none; }

  .horari-time {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    min-width: 48px;
    font-variant-numeric: tabular-nums;
  }

  .horari-label {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }

  .horari-sub {
    font-size: 12px;
    color: var(--grey-text);
    margin-top: 2px;
  }

  /* Calculadora sortida */
  .calc-box {
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
  }

  .calc-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--grey-text);
    margin-bottom: 12px;
  }

  .calc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .calc-row:last-child { border-bottom: none; }

  .calc-row label { color: var(--grey-text); }

  .calc-row input, .calc-row select {
    background: var(--grey-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 10px;
    width: 90px;
    text-align: right;
  }

  .calc-result {
    margin-top: 12px;
    padding: 12px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .calc-result-label {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }

  .calc-result-time {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  /* Localitzacions */
  .loc-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .loc-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    background: var(--grey-mid);
  }

  .loc-img-placeholder {
    width: 100%;
    height: 80px;
    background: var(--grey-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .loc-body {
    padding: 12px 14px;
  }

  .loc-type {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey-text);
    margin-bottom: 4px;
  }

  .loc-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .loc-addr {
    font-size: 12px;
    color: var(--grey-text);
    margin-bottom: 10px;
  }

  .btn-maps {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    border-radius: 6px;
    padding: 6px 12px;
    text-decoration: none;
  }

  /* Despeses */
  .despesa-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .despesa-row:last-child { border-bottom: none; }

  .despesa-icon {
    font-size: 18px;
    width: 32px;
    text-align: center;
  }

  .despesa-info { flex: 1; }

  .despesa-desc {
    font-size: 14px;
    font-weight: 500;
  }

  .despesa-who {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 1px;
  }

  .despesa-amount {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .despesa-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 0;
    font-weight: 700;
  }

  .despesa-total-label {
    font-size: 13px;
    color: var(--grey-text);
  }

  .despesa-total-amount {
    font-size: 22px;
    color: var(--accent); /* magenta */
    font-variant-numeric: tabular-nums;
  }

  /* Add despesa form */
  .add-form {
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
    display: none;
  }

  .add-form.open { display: block; }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .form-input {
    flex: 1;
    background: var(--grey-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
  }

  .form-input::placeholder { color: var(--grey-text); }

  .form-input:focus {
    outline: 1px solid var(--accent);
    outline-offset: -1px;
  }

  .form-submit {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }

  .btn-add {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    cursor: pointer;
    margin-top: 12px;
  }

  /* === NAV === */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    background: var(--black);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 200;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 0;
    color: var(--grey-text);
    font-family: 'Geologica', sans-serif;
    transition: color 0.15s;
  }

  .nav-item.active { color: var(--accent); }

  .nav-icon { font-size: 20px; line-height: 1; }

  .nav-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* === CALENDAR VIEW === */
  .cal-month { padding: 16px 20px 0; }

  .cal-month-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--grey-text);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .cal-concert-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .cal-concert-row:last-child { border-bottom: none; }

  .cal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .cal-date {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    color: var(--grey-text);
  }

  .cal-info { flex: 1; }

  .cal-city {
    font-size: 15px;
    font-weight: 700;
  }

  .cal-venue {
    font-size: 12px;
    color: var(--grey-text);
  }

  /* === DOCS VIEW === */
  .docs-section { padding: 16px 20px 0; }

  .doc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .doc-row:last-child { border-bottom: none; }

  .doc-icon {
    width: 36px;
    height: 36px;
    background: var(--grey-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .doc-info { flex: 1; }

  .doc-name {
    font-size: 14px;
    font-weight: 600;
  }

  .doc-meta {
    font-size: 11px;
    color: var(--grey-text);
    margin-top: 2px;
  }

  .doc-type {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--grey-mid);
    color: var(--grey-text);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* === UTILS === */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--grey-text);
    font-size: 14px;
  }

  .empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* Category pills */
  .pills-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }

  .pills-row::-webkit-scrollbar { display: none; }

  .pill {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    background: none;
    color: var(--grey-text);
    cursor: pointer;
    font-family: 'Geologica', sans-serif;
    transition: all 0.15s;
  }

  .pill.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Concerts filter per mes */
  .month-header {
    padding: 16px 20px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--grey-text);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  /* emoji selector despeses */
  .emoji-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .emoji-opt {
    font-size: 20px;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    transition: background 0.1s;
  }

  .emoji-opt.selected {
    background: var(--grey-mid);
    border-color: var(--accent);
  }

  /* === HOME BANNER === */
  .home-banner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    padding: 20px 20px 0;
  }

  .home-banner-left { flex: 1; }

  .home-banner-city {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 2px;
  }

  .home-banner-venue {
    font-size: 14px;
    color: var(--grey-text);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .home-banner-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .home-banner-meta span {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }

  .home-banner-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .home-banner-date {
    background: var(--accent);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 64px;
  }

  .home-banner-day {
    font-size: 28px;
    font-weight: 800;
    color: #000;
    line-height: 1;
  }

  .home-banner-month {
    font-size: 11px;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .home-cd {
    font-size: 12px;
    font-weight: 700;
    color: var(--grey-text);
    text-align: center;
    line-height: 1.4;
  }

  .cd-num {
    font-size: 14px;
    font-weight: 800;
    color: var(--white);
    font-variant-numeric: tabular-nums;
  }

  .cd-sep {
    font-size: 11px;
    color: var(--grey-text);
    margin: 0 2px;
  }

  .home-list-title {

const MESOS_ES = ['ene.','feb.','mar.','abr.','may.','jun.','jul.','ago.','sep.','oct.','nov.','dic.'];
const DIES_CA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

const MESOS_FULL_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function formatData(d) {
  const m = currentLang === 'ca' ? MESOS_CA[d.getMonth()] : MESOS_ES[d.getMonth()];
  const dia = currentLang === 'ca' ? DIES_CA[d.getDay()] : DIES_ES[d.getDay()];
  return `${dia}, ${d.getDate()} ${m} ${d.getFullYear()}`;
}

function formatDataCurta(d) {
  const m = currentLang === 'ca' ? MESOS_CA[d.getMonth()] : MESOS_ES[d.getMonth()];
  return `${d.getDate()} ${m}`;
}

function nextConcert() {
  const now = new Date();
  return CONCERTS.find(c => c.data >= now) || CONCERTS[CONCERTS.length - 1];

function msToCountdown(ms) {
  if (ms <= 0) return { d: 0, h: 0, m: 0, s: 0 };
  const s = Math.floor(ms / 1000);
  return {
    d: Math.floor(s / 86400),
    h: Math.floor((s % 86400) / 3600),
    m: Math.floor((s % 3600) / 60),
    s: s % 60
  };
}

function pad(n) { return String(n).padStart(2, '0'); }

function tipusLabel(t) {
  const map = {
    ca: { venue: 'Sala', allotjament: 'Allotjament', restaurant: 'On menjar', parking: 'Pàrquing' },
    es: { venue: 'Sala', allotjament: 'Alojamiento', restaurant: 'Dónde comer', parking: 'Parking' }
  };
  return (map[currentLang][t] || t);
}

function calcHoraSortida(loadInStr, distanciaKm) {
  const [h, m] = loadInStr.split(':').map(Number);
  const loadInMin = h * 60 + m;
  // temps viatge estimat: 90km/h + 10% + parades cada 2h (20min) + càrrega 30min
  const tempsViatge = Math.ceil((distanciaKm / 90) * 60 * 1.1);
  const parades = Math.floor(distanciaKm / 180) * 20;
  const totalMin = tempsViatge + parades + 30; // +30 marge
  const sortidaMin = loadInMin - totalMin;
  const sh = Math.floor(((sortidaMin % 1440) + 1440) % 1440 / 60);
  const sm = ((sortidaMin % 1440) + 1440) % 1440 % 60;
  return { hora: `${pad(sh)}:${pad(sm)}`, tempsViatge, parades };
}

      const dLabel = currentLang === 'ca' ? 'd' : 'd';
      el.innerHTML = `<span class="cd-num">${d}</span><span class="cd-sep">${dLabel}</span><span class="cd-num">${pad(h)}</span><span class="cd-sep">h</span><span class="cd-num">${pad(m)}</span><span class="cd-sep">m</span>`;
    } else {
      el.innerHTML = `<span style="color:var(--accent);font-weight:700">${currentLang === 'ca' ? 'Avui!' : '¡Hoy!'}</span>`;

  const { hora: sortida } = calcHoraSortida(c.loadIn, c.distanciaKm);
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${c.localitzacions[0].mapsQ}`;
  const propLabel = currentLang === 'ca' ? 'Proper' : 'Próximo';
  const navLabel = currentLang === 'ca' ? 'Navegar' : 'Navegar';
  const sortidaLabel = currentLang === 'ca' ? 'Sortida' : 'Salida';
  const totsLabel = currentLang === 'ca' ? 'Tots els concerts' : 'Todos los conciertos';
  const propersLabel = currentLang === 'ca' ? 'Propers' : 'Próximos';
  const passatsLabel = currentLang === 'ca' ? 'Passats' : 'Pasados';

  document.getElementById('home-next').innerHTML = `
    <div class="home-banner" onclick="showDetail(${c.id})">
      <div class="home-banner-left">
        <div class="next-label">${propLabel}</div>
        <div class="home-banner-city">${c.ciutat}</div>
        <div class="home-banner-venue">${c.sala}</div>
        <div class="home-banner-meta">
          <span>🎸 ${c.setTime}</span>
          <span>📍 ${c.distanciaKm} km</span>
          <span>🚗 ${sortidaLabel} ${sortida}</span>
        </div>
      </div>
      <div class="home-banner-right">
        <div class="home-banner-date">
          <div class="home-banner-day">${c.data.getDate()}</div>
          <div class="home-banner-month">${(currentLang === 'ca' ? MESOS_CA : MESOS_ES)[c.data.getMonth()].replace('.','')}</div>
        </div>
        <div id="countdown-display" class="home-cd"></div>
      </div>
    </div>
    <a href="${mapUrl}" target="_blank" class="btn-primary" style="margin-top:10px" onclick="event.stopPropagation()">📍 ${navLabel} — ${c.sala}</a>
  `;

  updateCountdown();
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(updateCountdown, 1000);

  // --- Llistat complet de concerts ---
  const upcoming = CONCERTS.filter(x => x.data >= now);
  const past = CONCERTS.filter(x => x.data < now);

  let listHTML = `<div class="home-list-title">${totsLabel}</div>`;

  if (upcoming.length) {
    listHTML += `<div class="month-header">${propersLabel}</div>`;
    listHTML += upcoming.map((x, i) => concertCard(x, i === 0)).join('');
  }
  if (past.length) {
    listHTML += `<div class="month-header" style="margin-top:4px">${passatsLabel}</div>`;
    listHTML += past.map(x => concertCard(x, false, true)).join('');
  }

  document.getElementById('home-schedule').innerHTML = listHTML;
}

function renderDespesesList(c) {
  if (c.despeses.length === 0) {
    return `<div style="color:var(--grey-text);font-size:13px;padding:8px 0">${currentLang === 'ca' ? 'Sense despeses registrades.' : 'Sin gastos registrados.'}</div>`;
  }
  return c.despeses.map(d => `
    <div class="despesa-row">
      <div class="despesa-icon">${d.emoji}</div>
      <div class="despesa-info">
        <div class="despesa-desc">${d.desc}</div>
        <div class="despesa-who">${d.qui}</div>
      </div>
      <div class="despesa-amount">${d.import.toFixed(2)} €</div>
    </div>
  `).join('');
}

function docIcon(t) {
  return { contracte: '📋', rider: '🎛️', dni: '🪪', altres: '📄' }[t] || '📄';
}

function recalcSortida(id) {
  const loadIn = document.getElementById(`calc-loadin-${id}`).value;
  const km = parseInt(document.getElementById(`calc-km-${id}`).value) || 0;
  const extra = parseInt(document.getElementById(`calc-extra-${id}`).value) || 0;

  const [h, m] = loadIn.split(':').map(Number);
  const loadInMin = h * 60 + m;
  const tempsViatge = Math.ceil((km / 90) * 60 * 1.1);
  const parades = Math.floor(km / 180) * 20;
  const totalMin = tempsViatge + parades + extra;
  const sortidaMin = loadInMin - totalMin;
  const sh = Math.floor(((sortidaMin % 1440) + 1440) % 1440 / 60);
  const sm = ((sortidaMin % 1440) + 1440) % 1440 % 60;
  const sortida = `${pad(sh)}:${pad(sm)}`;

  document.getElementById(`calc-result-${id}`).innerHTML = `
    <span class="calc-result-label">${currentLang === 'ca' ? 'Hora de sortida' : 'Hora de salida'}</span>
    <span class="calc-result-time">${sortida}</span>
  `;
}

function toggleAddDespesa(id) {
  const form = document.getElementById(`add-despesa-form-${id}`);
  form.classList.toggle('open');
}

function selectEmoji(e, id) {
  despesesEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(b => {
    b.classList.toggle('selected', b.textContent === e);
  });
}

function addDespesa(id) {
  const c = CONCERTS.find(x => x.id === id);
  const desc = document.getElementById(`despesa-desc-${id}`).value.trim();
  const qui = document.getElementById(`despesa-qui-${id}`).value.trim();
  const imp = parseFloat(document.getElementById(`despesa-import-${id}`).value);
  if (!desc || isNaN(imp)) return;

  c.despeses.push({
    id: Date.now(),
    emoji: despesesEmoji,
    desc,
    qui: qui || '—',
    import: imp
  });

  renderDetail(id);
}

function renderCalendar() {
  // Agrupa per mes/any
  const groups = {};
  CONCERTS.forEach(c => {
    const key = `${c.data.getFullYear()}-${c.data.getMonth()}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  const now = new Date();
  let html = '';
  Object.keys(groups).sort().forEach(key => {
    const [y, mo] = key.split('-').map(Number);
    const mesLabel = (currentLang === 'ca' ? MESOS_FULL_CA : MESOS_FULL_ES)[mo];
    html += `<div class="cal-month"><div class="cal-month-title">${mesLabel} ${y}</div>`;
    groups[key].forEach(c => {
      const isPast = c.data < now;
      const isNext = !isPast && !CONCERTS.slice(0, CONCERTS.indexOf(c)).some(x => x.data >= now);
      html += `
        <div class="cal-concert-row" onclick="showDetail(${c.id})" style="${isPast ? 'opacity:0.45' : ''}">
          <div class="cal-dot" style="${isPast ? 'background:var(--grey-text)' : ''}"></div>
          <div class="cal-date">${formatDataCurta(c.data)}</div>
          <div class="cal-info">
            <div class="cal-city">${c.ciutat}</div>
            <div class="cal-venue">${c.sala}</div>
          </div>
          ${isNext ? `<span class="tag next" style="flex-shrink:0">${currentLang === 'ca' ? 'Proper' : 'Próximo'}</span>` : ''}
        </div>`;
    });
    html += '</div><hr class="sep">';
  });

  document.getElementById('calendar-content').innerHTML = html;
}

const CREW_TOKEN = 'c113road'; // canvia això per personalitzar

function isCrew() {
  // Comprova URL param o localStorage
  const params = new URLSearchParams(window.location.search);
  if (params.get('crew') === CREW_TOKEN) {
    localStorage.setItem('c113_crew', CREW_TOKEN);
    // Neteja la URL sense recarregar
    window.history.replaceState({}, '', window.location.pathname);
    return true;
  }
  return localStorage.getItem('c113_crew') === CREW_TOKEN;
}

function promptCrewAccess() {
  const token = prompt(`Codi d'accés:`);

    location.reload();
  } else if (token !== null) {
