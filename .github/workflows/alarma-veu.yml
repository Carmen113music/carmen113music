name: Alarma per veu (APK)

on:
  push:
    paths:
      - 'alarma-veu/**'
      - '.github/workflows/alarma-veu.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: alarma-veu
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compila l'APK
        run: gradle assembleDebug --no-daemon

      - name: Canvia el nom de l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlarmaPerVeu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlarmaPerVeu
          path: alarma-veu/AlarmaPerVeu.apk
          retention-days: 30
